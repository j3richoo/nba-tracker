<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Live Player Tracker</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;--accent:#e8590c;--live:#16a34a;--hover:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#171a21;--text:#f1f3f5;--muted:#9aa3af;--line:#262a33;--accent:#ff8a3d;--live:#4ade80;--hover:#20242d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex-wrap:wrap}
h1{font-size:1.1rem;margin:0}
#status{color:var(--muted);font-size:.75rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:0 16px 24px;max-width:1100px;margin:0 auto}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:.8rem;letter-spacing:.04em;color:var(--muted)}
.ph button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.7rem;cursor:pointer}
.search{position:relative;padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem}
#sug{position:absolute;left:12px;right:12px;top:48px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10;display:none;max-height:340px;overflow:auto}
.sg{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer}
.sg:hover,.sg.on{background:var(--hover)}
.sg .t{color:var(--muted);font-size:.75rem;display:flex;align-items:center;gap:4px}
.face{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.tl{width:16px;height:16px;object-fit:contain;flex:none}
.hd,.row{display:grid;grid-template-columns:34px minmax(0,1fr) 46px 34px 34px 20px 20px;gap:8px;align-items:center;padding:6px 12px}
.hd{font-size:.65rem;color:var(--muted);font-weight:700;text-align:center;border-bottom:1px solid var(--line)}
.wrap{border-bottom:1px solid var(--line)}
.wrap:last-child{border:0}
.wrap.hit{background:rgba(34,197,94,.10)}
.hit .nm{color:var(--live)}
.sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 8px 54px;font-size:.72rem}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:1px 4px 1px 8px;color:var(--muted)}
.chip.ok{border-color:var(--live);color:var(--live);font-weight:700}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 3px;font-size:.85rem}
.ed{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.ed select,.ed input{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-size:.8rem}
.ed input{width:56px}
.ed button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:3px 10px;font-weight:600;cursor:pointer}
.who{min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.gm{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm.live{color:var(--live);font-weight:600}
.n{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.n.pts{font-size:1.25rem;font-weight:800;color:var(--accent)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;padding:0}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.day{padding:6px 12px;font-size:.7rem;font-weight:700;color:var(--muted);background:var(--bg);letter-spacing:.04em}
.g{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.tm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.82rem}
.tm span.s{margin-left:auto;font-variant-numeric:tabular-nums}
.gt{font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap}
.gt.live{color:var(--live);font-weight:700}
.dot{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;font-size:.65rem;padding:0 6px;margin-left:4px}
</style>
</head>
<body>
<header><h1>🏀 NBA Live Tracker</h1><div id="status">Loading…</div></header>
<div class="layout">
  <section class="panel">
    <div class="search">
      <input id="inp" placeholder="Search any NBA player…" autocomplete="off">
      <div id="sug"></div>
    </div>
    <div class="ph"><span>MY PLAYERS (<span id="cnt">0</span>)</span><button id="sortBtn"></button></div>
    <div class="hd"><span></span><span style="text-align:left">PLAYER</span><span>PTS</span><span>REB</span><span>AST</span><span></span><span></span></div>
    <div id="list"></div>
  </section>
  <aside class="panel">
    <div class="ph"><span>GAMES · NEXT 3 DAYS</span></div>
    <div id="sched"></div>
  </aside>
</div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const j=async(path,params={})=>{const q=new URLSearchParams({p:'basketball/nba/'+path,...params});const r=await fetch('/api/espn?'+q);if(!r.ok)throw new Error(r.status);return r.json()};
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let teams={},players=[],games=[],box={};
const STATS={PTS:'Points',REB:'Rebounds',AST:'Assists',STL:'Steals',BLK:'Blocks','3PM':'3PT made',TO:'Turnovers'};
const val=(b,k)=>k==='3PM'?(parseInt(b['3PT'])||0):(+b[k]||0);
let editId=null,draft={stat:'PTS',min:10};
let watch=ls.get('nbaWatch2',[]),sortMode=ls.get('nbaSort','pts');
const face=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const imgErr="this.onerror=null;this.style.visibility='hidden'";
const tImg=t=>t?.logo?`<img class="tl" src="${esc(t.logo)}" onerror="${imgErr}">`:'';
const fmtT=d=>new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

async function loadRosters(){
  const c=ls.get('nbaRoster',null);
  if(c&&Date.now()-c.t<864e5){teams=c.teams;players=c.players;return}
  const d=await j('teams');
  d.sports[0].leagues[0].teams.forEach(({team:t})=>teams[t.id]={id:t.id,abbr:t.abbreviation,logo:t.logos?.[0]?.href,name:t.displayName});
  await Promise.all(Object.keys(teams).map(async id=>{
    try{
      const r=await j(`teams/${id}/roster`);
      let a=r.athletes||[];if(a.length&&a[0].items)a=a.flatMap(x=>x.items);
      a.forEach(p=>players.push({id:p.id,name:p.displayName,team:id,pos:p.position?.abbreviation||'',img:p.headshot?.href||face(p.id)}));
    }catch(e){}
  }));
  ls.set('nbaRoster',{t:Date.now(),teams,players});
}

async function refresh(){
  try{
    const days=[-1,0,1,2,3].map(n=>ymd(new Date(Date.now()+n*864e5)));
    const res=await Promise.all(days.map(d=>j('scoreboard',{dates:d,limit:100}).catch(()=>({events:[]}))));
    const seen=new Set();
    games=res.flatMap(r=>r.events||[]).filter(g=>!seen.has(g.id)&&seen.add(g.id)).sort((x,y)=>new Date(x.date)-new Date(y.date));
    if(!games.length)throw new Error('no data');
    await Promise.all(games.filter(g=>g.status.type.state!=='pre'&&Date.now()-new Date(g.date)<36e5*30).map(async g=>{
      try{
        const s=await j('summary',{event:g.id}),out={};
        (s.boxscore?.players||[]).forEach(t=>{
          const st=t.statistics?.[0];if(!st)return;
          (st.athletes||[]).forEach(p=>{
            const o={dnp:p.didNotPlay||!p.stats?.length};
            (st.labels||[]).forEach((l,i)=>o[l]=p.stats?.[i]);
            out[p.athlete.id]=o;
          });
        });
        box[g.id]=out;
      }catch(e){}
    }));
    $('status').textContent='Updated '+new Date().toLocaleTimeString()+' · refreshes every 20s';
  }catch(e){$('status').textContent='⚠ Could not reach ESPN'}
  render();
}

const teamsOf=g=>g.competitions[0].competitors;
function pickGame(tid){
  const m=games.filter(g=>teamsOf(g).some(c=>c.team.id===tid));
  return m.find(g=>g.status.type.state==='in')
    ||[...m].reverse().find(g=>g.status.type.state==='post'&&Date.now()-new Date(g.date)<36e5*14)
    ||m.find(g=>g.status.type.state==='pre')
    ||m[m.length-1];
}

function rowData(w){
  const g=pickGame(w.team),t=teams[w.team];
  const r={w,t,rules:(w.rules||[]).map(x=>({...x,v:null,ok:false})),hit:false,pts:null,reb:'',ast:'',gm:'No game in next 3 days',live:false,state:'none'};
  if(!g)return r;
  const c=teamsOf(g),h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');
  const ab=x=>teams[x.team.id]?.abbr||x.team.abbreviation,state=g.status.type.state;
  r.state=state;
  if(state==='pre'){
    const day=new Date(g.date).toLocaleDateString([],{weekday:'short'});
    r.gm=`${ab(a)} @ ${ab(h)} · ${day} ${fmtT(g.date)}`;
  }else{
    r.live=state==='in';
    r.gm=`${ab(a)} ${a.score} @ ${ab(h)} ${h.score} · ${g.status.type.shortDetail}`;
    const b=box[g.id]?.[w.id];
    if(b&&!b.dnp){r.b=b;r.pts=+b.PTS||0;r.reb=b.REB??'';r.ast=b.AST??''}
    else if(b)r.gm+=' · DNP';
  }
  if(r.b){r.rules=r.rules.map(x=>{const v=val(r.b,x.stat);return {...x,v,ok:v>=x.min}});r.hit=r.rules.some(x=>x.ok)}
  return r;
}

function sub(r){
  const id=esc(r.w.id);
  const chips=r.rules.map((x,i)=>`<span class="chip${x.ok?' ok':''}">${x.ok?'✓ ':''}${esc(STATS[x.stat])} ≥ ${x.min}${x.v!==null?' ('+x.v+')':''}<button onclick="rmRule('${id}',${i})" title="Remove alert">×</button></span>`).join('');
  const ed=editId===r.w.id?`<div class="ed">Green when <select onchange="draft.stat=this.value">${Object.entries(STATS).map(([k,n])=>`<option value="${k}"${draft.stat===k?' selected':''}>${n}</option>`).join('')}</select> ≥ <input type="number" min="1" value="${draft.min}" oninput="draft.min=+this.value" onkeydown="if(event.key==='Enter')addRule('${id}')"><button onclick="addRule('${id}')">Add</button></div>`:'';
  return chips||ed?`<div class="sub">${chips}${ed}</div>`:'';
}
window.toggleEdit=id=>{editId=editId===id?null:id;render();setTimeout(()=>document.querySelector('.ed input')?.focus(),0)};
window.addRule=id=>{
  const w=watch.find(x=>x.id===id);if(!w||!(draft.min>0))return;
  w.rules=(w.rules||[]).concat({stat:draft.stat,min:draft.min});
  ls.set('nbaWatch2',watch);editId=null;render();
};
window.rmRule=(id,i)=>{const w=watch.find(x=>x.id===id);if(!w)return;w.rules.splice(i,1);ls.set('nbaWatch2',watch);render()};

function render(){
  if(editId&&/^(INPUT|SELECT)$/.test(document.activeElement.tagName)&&$('list').contains(document.activeElement))return renderSched();
  $('cnt').textContent=watch.length;
  $('sortBtn').textContent=sortMode==='pts'?'Sort: Points':'Sort: Added';
  if(!watch.length)$('list').innerHTML='<div class="empty">Search a player above to start tracking.</div>';
  else{
    let rows=watch.map(rowData);
    if(sortMode==='pts')rows.sort((a,b)=>(b.live-a.live)||((b.pts??-1)-(a.pts??-1)));
    $('list').innerHTML=rows.map(r=>`<div class="wrap${r.hit?' hit':''}"><div class="row">
      <img class="face" src="${esc(face(r.w.id))}" onerror="${imgErr}">
      <div class="who"><div class="nm">${esc(r.w.name)} ${tImg(r.t)}</div>
      <div class="gm${r.live?' live':''}">${r.live?'● ':''}${esc(r.gm)}</div></div>
      <div class="n pts">${r.pts??'–'}</div><div class="n">${r.reb||'–'}</div><div class="n">${r.ast||'–'}</div>
      <button class="x" onclick="toggleEdit('${esc(r.w.id)}')" title="Add alert">🎯</button>
      <button class="x" onclick="rm('${esc(r.w.id)}')" title="Remove">×</button></div>${sub(r)}</div>`).join('');
  }
  renderSched();
}

function renderSched(){
  const tracked=new Set(watch.map(w=>w.team));
  const list=games.filter(g=>g.status.type.state!=='post');
  if(!list.length){$('sched').innerHTML='<div class="empty">No games found.</div>';return}
  const today=new Date().toDateString(),tom=new Date(Date.now()+864e5).toDateString();
  let html='',last='';
  const live=list.filter(g=>g.status.type.state==='in'),rest=list.filter(g=>g.status.type.state==='pre');
  const card=g=>{
    const c=teamsOf(g),a=c.find(x=>x.homeAway==='away'),h=c.find(x=>x.homeAway==='home'),st=g.status.type.state;
    const mine=[a,h].reduce((n,x)=>n+watch.filter(w=>w.team===x.team.id).length,0);
    const row=x=>`<div class="tm">${tImg(teams[x.team.id]||x.team)}${esc(teams[x.team.id]?.abbr||x.team.abbreviation)}${st==='in'?`<span class="s">${x.score}</span>`:''}</div>`;
    return `<div class="g"><div>${row(a)}${row(h)}</div><div class="gt${st==='in'?' live':''}">${st==='in'?'● '+esc(g.status.type.shortDetail):fmtT(g.date)}${mine?`<br><span class="dot">${mine} tracked</span>`:''}</div></div>`;
  };
  if(live.length)html+='<div class="day">LIVE NOW</div>'+live.map(card).join('');
  rest.forEach(g=>{
    const ds=new Date(g.date).toDateString();
    if(ds!==last){last=ds;html+=`<div class="day">${ds===today?'TODAY':ds===tom?'TOMORROW':new Date(g.date).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}).toUpperCase()}</div>`}
    html+=card(g);
  });
  $('sched').innerHTML=html;
}

/* search */
let sel=0,cur=[];
function suggest(){
  const q=$('inp').value.trim().toLowerCase(),box=$('sug');
  if(q.length<2){box.style.display='none';return}
  cur=players.filter(p=>p.name.toLowerCase().includes(q)&&!watch.some(w=>w.id===p.id)).slice(0,8);sel=0;
  box.innerHTML=cur.map((p,i)=>`<div class="sg${i?'':' on'}" data-i="${i}">
    <img class="face" src="${esc(p.img)}" onerror="${imgErr}">
    <div><b>${esc(p.name)}</b><div class="t">${tImg(teams[p.team])}${esc(teams[p.team]?.name||'')} ${p.pos?'· '+esc(p.pos):''}</div></div></div>`).join('')||'<div class="empty">No players found</div>';
  box.style.display='block';
}
function add(p){
  if(!p)return;
  watch.push({id:p.id,name:p.name,team:p.team});ls.set('nbaWatch2',watch);
  $('inp').value='';$('sug').style.display='none';render();
}
window.rm=id=>{watch=watch.filter(w=>w.id!==id);ls.set('nbaWatch2',watch);render()};
$('inp').addEventListener('input',suggest);
$('inp').addEventListener('keydown',e=>{
  const els=[...document.querySelectorAll('.sg')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(els.length-1,sel+(e.key==='ArrowDown'?1:-1)));els.forEach((x,i)=>x.classList.toggle('on',i===sel))}
  if(e.key==='Enter')add(cur[sel]);
  if(e.key==='Escape')$('sug').style.display='none';
});
$('sug').addEventListener('mousedown',e=>{const s=e.target.closest('.sg');if(s)add(cur[+s.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sug').style.display='none'});
$('sortBtn').onclick=()=>{sortMode=sortMode==='pts'?'added':'pts';ls.set('nbaSort',sortMode);render()};

(async()=>{
  render();
  try{await loadRosters()}catch(e){$('status').textContent='⚠ Could not load players'}
  watch=watch.map(w=>w.team?w:{...w,team:players.find(p=>p.id===w.id)?.team});
  await refresh();
  setInterval(refresh,20000);
})();
</script>
</body>
</html>
