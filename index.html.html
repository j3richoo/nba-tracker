<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Live Player Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0a0c14;--card:#131724;--card2:#0f1320;--text:#eef0f7;--muted:#8b93a7;--line:#222840;--accent:#8b7dff;--accent2:#ff8f5a;--live:#34d399;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;background:var(--bg) radial-gradient(900px 380px at 15% -10%,rgba(109,94,252,.16),transparent 60%),radial-gradient(700px 320px at 95% 0,rgba(255,122,69,.12),transparent 60%) no-repeat;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:1.1rem;box-shadow:0 6px 16px rgba(109,94,252,.35)}
h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
#status{color:var(--muted);font-size:.74rem;background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:0 20px 28px;max-width:1180px;margin:0 auto;align-items:start}
@media(max-width:880px){.layout{grid-template-columns:1fr;padding:0 12px 24px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
.ph button{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 12px;font-size:.7rem;cursor:pointer;font-weight:600}
#rec{color:var(--live)}
.search{position:relative;padding:12px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);font-size:.95rem;outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,94,252,.18)}
#sug{position:absolute;left:14px;right:14px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:10;display:none;max-height:360px;overflow:auto;padding:4px}
.sg{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;border-radius:10px}
.sg:hover,.sg.on{background:var(--card2)}
.sg .t{color:var(--muted);font-size:.75rem;display:flex;align-items:center;gap:4px}
.face{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.tl{width:16px;height:16px;object-fit:contain;flex:none}
.hd,.row{display:grid;grid-template-columns:36px minmax(0,1fr) 46px 34px 34px 22px 22px;gap:8px;align-items:center;padding:8px 14px}
.hd{font-size:.62rem;color:var(--muted);font-weight:700;text-align:center;letter-spacing:.08em;padding-top:6px;padding-bottom:6px}
.wrap{border-top:1px solid var(--line);transition:background .2s}
.wrap:hover{background:var(--card2)}
.wrap.hit{background:linear-gradient(90deg,rgba(16,185,129,.16),rgba(16,185,129,.04))}
.hit .nm{color:var(--live)}
.who{min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.gm{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gm.live{color:var(--live);font-weight:600}
.n{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.n.pts{font-size:1.3rem;font-weight:800;color:var(--accent2)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;padding:0;opacity:.75;transition:.15s}
.x:hover{opacity:1;transform:scale(1.15)}
.empty{color:var(--muted);text-align:center;padding:30px 14px}
.sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 10px 58px;font-size:.72rem}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;color:var(--muted);background:var(--card2)}
.chip.ok{border-color:var(--live);color:var(--live);font-weight:700}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 4px;font-size:.85rem}
.ed{width:100%;display:flex;flex-direction:column;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--muted)}
.edr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ed select,.ed input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:.8rem}
.ed input{width:60px}
.add{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:5px 14px;font-weight:700;cursor:pointer}
.qk{display:flex;flex-wrap:wrap;gap:5px}
.q{min-width:34px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;font-size:.78rem;cursor:pointer;transition:.12s}
.q:hover{border-color:var(--accent);color:var(--accent)}
.q.on{background:var(--live);border-color:var(--live);color:#fff}
.day{padding:8px 14px;font-size:.66rem;font-weight:800;color:var(--muted);letter-spacing:.1em;background:var(--card2);border-top:1px solid var(--line)}
.g{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.tm{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.84rem;cursor:pointer;transition:.12s}
.tm:hover{background:var(--card2)}
.tm.picked{border-color:var(--accent);background:rgba(109,94,252,.10)}
.tm.win .ab{color:var(--live)}
.tm .s{margin-left:auto;font-variant-numeric:tabular-nums}
.pk{font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff;letter-spacing:.04em}
.pk.ok{background:var(--live)}.pk.bad{background:var(--bad)}
.gt{font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap;padding-right:4px}
.gt.live{color:var(--live);font-weight:700}
.dot{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;font-size:.62rem;padding:1px 7px;margin-top:4px}
.tip{padding:8px 14px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--line)}
#picksBar{max-width:1180px;margin:0 auto 14px;padding:0 20px}
#picksBar:empty{display:none}
@media(max-width:880px){#picksBar{padding:0 12px}}
.pbh{font-size:.66rem;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:0 2px 8px}
.pbl{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pc{flex:none;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.pc img{width:40px;height:40px;object-fit:contain}
.pc .pn{font-weight:800}
.pc .pi{font-size:.72rem;color:var(--muted);margin-top:2px;white-space:nowrap}
.pc.live{border-color:var(--live)}.pc.live .pi{color:var(--live);font-weight:700}
.pc.ok{border-color:var(--live);background:linear-gradient(90deg,rgba(52,211,153,.14),var(--card))}.pc.ok .pi{color:var(--live);font-weight:700}
.pc.bad{border-color:var(--bad)}.pc.bad .pi{color:var(--bad);font-weight:700}
.pc button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 0 0 2px}
#pickPop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.62);backdrop-filter:blur(6px);z-index:100;cursor:pointer}
#pickPop.show{display:flex;animation:fade .18s ease}
.pp{background:var(--card);border:1px solid var(--accent);border-radius:24px;padding:28px 40px;text-align:center;box-shadow:0 0 0 6px rgba(139,125,255,.15),0 30px 80px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.pp img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.pp .k{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--accent);margin-top:10px}
.pp .t{font-size:1.5rem;font-weight:800;margin-top:4px}
.pp .m{font-size:.8rem;color:var(--muted);margin-top:6px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="pickPop" onclick="this.classList.remove('show')"></div>
<header><div class="brand"><span class="logo">🏀</span><h1>NBA Live Tracker</h1></div><div id="status">Loading…</div></header>
<div id="picksBar"></div>
<div class="layout">
  <section class="panel">
    <div class="search">
      <input id="inp" placeholder="Search any NBA player…" autocomplete="off">
      <div id="sug"></div>
    </div>
    <div class="ph"><span>MY PLAYERS (<span id="cnt">0</span>)</span><button id="sortBtn"></button></div>
    <div class="hd"><span></span><span style="text-align:left">PLAYER</span><span>PTS</span><span>REB</span><span>AST</span><span></span><span></span></div>
    <div id="list"></div>
  </section>
  <aside class="panel">
    <div class="ph"><span>GAMES · NEXT 3 DAYS</span><span id="rec"></span></div>
    <div id="sched"></div>
  </aside>
</div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const j=async(path,params={})=>{const q=new URLSearchParams({p:'basketball/nba/'+path,...params});const r=await fetch('/api/espn?'+q);if(!r.ok)throw new Error(r.status);return r.json()};
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let teams={},players=[],games=[],box={};
const STATS={PTS:'Points',REB:'Rebounds',AST:'Assists',STL:'Steals',BLK:'Blocks','3PM':'3PT made',TO:'Turnovers'};
const val=(b,k)=>k==='3PM'?(parseInt(b['3PT'])||0):(+b[k]||0);
let editId=null,draft={stat:'PTS',min:10},picks=ls.get('nbaPicks',{});
let watch=ls.get('nbaWatch2',[]),sortMode=ls.get('nbaSort','pts');
const face=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const imgErr="this.onerror=null;this.style.visibility='hidden'";
const tImg=t=>t?.logo?`<img class="tl" src="${esc(t.logo)}" onerror="${imgErr}">`:'';
const fmtT=d=>new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

async function loadRosters(){
  const c=ls.get('nbaRoster',null);
  if(c&&Date.now()-c.t<864e5){teams=c.teams;players=c.players;return}
  const d=await j('teams');
  d.sports[0].leagues[0].teams.forEach(({team:t})=>teams[t.id]={id:t.id,abbr:t.abbreviation,logo:t.logos?.[0]?.href,name:t.displayName});
  await Promise.all(Object.keys(teams).map(async id=>{
    try{
      const r=await j(`teams/${id}/roster`);
      let a=r.athletes||[];if(a.length&&a[0].items)a=a.flatMap(x=>x.items);
      a.forEach(p=>players.push({id:p.id,name:p.displayName,team:id,pos:p.position?.abbreviation||'',img:p.headshot?.href||face(p.id)}));
    }catch(e){}
  }));
  ls.set('nbaRoster',{t:Date.now(),teams,players});
}

async function refresh(){
  try{
    const days=[-1,0,1,2,3].map(n=>ymd(new Date(Date.now()+n*864e5)));
    const res=await Promise.all(days.map(d=>j('scoreboard',{dates:d,limit:100}).catch(()=>({events:[]}))));
    const seen=new Set();
    games=res.flatMap(r=>r.events||[]).filter(g=>!seen.has(g.id)&&seen.add(g.id)).sort((x,y)=>new Date(x.date)-new Date(y.date));
    if(!games.length)throw new Error('no data');
    await Promise.all(games.filter(g=>g.status.type.state!=='pre'&&Date.now()-new Date(g.date)<36e5*30).map(async g=>{
      try{
        const s=await j('summary',{event:g.id}),out={};
        (s.boxscore?.players||[]).forEach(t=>{
          const st=t.statistics?.[0];if(!st)return;
          (st.athletes||[]).forEach(p=>{
            const o={dnp:p.didNotPlay||!p.stats?.length};
            (st.labels||[]).forEach((l,i)=>o[l]=p.stats?.[i]);
            out[p.athlete.id]=o;
          });
        });
        box[g.id]=out;
      }catch(e){}
    }));
    $('status').textContent='Updated '+new Date().toLocaleTimeString()+' · refreshes every 20s';
  }catch(e){$('status').textContent='⚠ Could not reach ESPN'}
  render();
}

const teamsOf=g=>g.competitions[0].competitors;
function pickGame(tid){
  const m=games.filter(g=>teamsOf(g).some(c=>c.team.id===tid));
  return m.find(g=>g.status.type.state==='in')
    ||[...m].reverse().find(g=>g.status.type.state==='post'&&Date.now()-new Date(g.date)<36e5*14)
    ||m.find(g=>g.status.type.state==='pre')
    ||m[m.length-1];
}

function rowData(w){
  const g=pickGame(w.team),t=teams[w.team];
  const r={w,t,rules:(w.rules||[]).map(x=>({...x,v:null,ok:false})),hit:false,pts:null,reb:'',ast:'',gm:'No game in next 3 days',live:false,state:'none'};
  if(!g)return r;
  const c=teamsOf(g),h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');
  const ab=x=>teams[x.team.id]?.abbr||x.team.abbreviation,state=g.status.type.state;
  r.state=state;
  if(state==='pre'){
    const day=new Date(g.date).toLocaleDateString([],{weekday:'short'});
    r.gm=`${ab(a)} @ ${ab(h)} · ${day} ${fmtT(g.date)}`;
  }else{
    r.live=state==='in';
    r.gm=`${ab(a)} ${a.score} @ ${ab(h)} ${h.score} · ${g.status.type.shortDetail}`;
    const b=box[g.id]?.[w.id];
    if(b&&!b.dnp){r.b=b;r.pts=+b.PTS||0;r.reb=b.REB??'';r.ast=b.AST??''}
    else if(b)r.gm+=' · DNP';
  }
  if(r.b){r.rules=r.rules.map(x=>{const v=val(r.b,x.stat);return {...x,v,ok:v>=x.min}});r.hit=r.rules.some(x=>x.ok)}
  return r;
}

function sub(r){
  const id=esc(r.w.id);
  const chips=r.rules.map((x,i)=>`<span class="chip${x.ok?' ok':''}">${x.ok?'✓ ':''}${esc(STATS[x.stat])} ≥ ${x.min}${x.v!==null?' ('+x.v+')':''}<button onclick="rmRule('${id}',${i})" title="Remove alert">×</button></span>`).join('');
  const w=watch.find(x=>x.id===r.w.id)||{},have=(w.rules||[]).filter(x=>x.stat===draft.stat).map(x=>x.min);
  const qk=[5,10,15,20,25,30,35,40,45,50].map(n=>`<button class="q${have.includes(n)?' on':''}" onclick="quick('${id}',${n})">${n}</button>`).join('');
  const ed=editId===r.w.id?`<div class="ed"><div class="edr">Green when <select onchange="draft.stat=this.value;render(true)">${Object.entries(STATS).map(([k,n])=>`<option value="${k}"${draft.stat===k?' selected':''}>${n}</option>`).join('')}</select> ≥ <input type="number" min="1" value="${draft.min}" oninput="draft.min=+this.value" onkeydown="if(event.key==='Enter')addRule('${id}')"><button class="add" onclick="addRule('${id}')">Add</button></div><div class="qk">${qk}</div></div>`:'';
  return chips||ed?`<div class="sub">${chips}${ed}</div>`:'';
}
window.toggleEdit=id=>{editId=editId===id?null:id;render();setTimeout(()=>document.querySelector('.ed input')?.focus(),0)};
window.addRule=id=>{
  const w=watch.find(x=>x.id===id);if(!w||!(draft.min>0))return;
  w.rules=(w.rules||[]).concat({stat:draft.stat,min:draft.min});
  ls.set('nbaWatch2',watch);editId=null;render();
};
window.quick=(id,n)=>{
  const w=watch.find(x=>x.id===id);if(!w)return;
  const rs=w.rules||[],i=rs.findIndex(x=>x.stat===draft.stat&&x.min===n);
  w.rules=i>=0?rs.filter((_,k)=>k!==i):rs.concat({stat:draft.stat,min:n});
  ls.set('nbaWatch2',watch);render();
};
window.pick=(gid,tid)=>{
  const g=games.find(x=>x.id===gid);if(!g||g.status.type.state!=='pre')return;
  if(picks[gid]===tid)delete picks[gid];else picks[gid]=tid;
  ls.set('nbaPicks',picks);renderSched();
  if(picks[gid]){
    const c=teamsOf(g),a=c.find(x=>x.homeAway==='away'),h=c.find(x=>x.homeAway==='home');
    const ab=x=>teams[x.team.id]?.abbr||x.team.abbreviation,t=teams[tid]||c.find(x=>x.team.id===tid).team;
    const pop=$('pickPop');
    pop.innerHTML=`<div class="pp">${t.logo?`<img src="${esc(t.logo)}" onerror="${imgErr}">`:''}<div class="k">YOUR PICK TO WIN</div><div class="t">${esc(t.name||t.displayName||t.abbreviation)}</div><div class="m">${esc(ab(a))} @ ${esc(ab(h))} · ${fmtT(g.date)}</div></div>`;
    pop.classList.add('show');
    clearTimeout(window._pp);window._pp=setTimeout(()=>pop.classList.remove('show'),2200);
  }
};
window.rmRule=(id,i)=>{const w=watch.find(x=>x.id===id);if(!w)return;w.rules.splice(i,1);ls.set('nbaWatch2',watch);render()};

function render(force){
  if(!force&&editId&&/^(INPUT|SELECT)$/.test(document.activeElement.tagName)&&$('list').contains(document.activeElement))return renderSched();
  $('cnt').textContent=watch.length;
  $('sortBtn').textContent=sortMode==='pts'?'Sort: Points':'Sort: Added';
  if(!watch.length)$('list').innerHTML='<div class="empty">Search a player above to start tracking.</div>';
  else{
    let rows=watch.map(rowData);
    if(sortMode==='pts')rows.sort((a,b)=>(b.live-a.live)||((b.pts??-1)-(a.pts??-1)));
    $('list').innerHTML=rows.map(r=>`<div class="wrap${r.hit?' hit':''}"><div class="row">
      <img class="face" src="${esc(face(r.w.id))}" onerror="${imgErr}">
      <div class="who"><div class="nm">${esc(r.w.name)} ${tImg(r.t)}</div>
      <div class="gm${r.live?' live':''}">${r.live?'● ':''}${esc(r.gm)}</div></div>
      <div class="n pts">${r.pts??'–'}</div><div class="n">${r.reb||'–'}</div><div class="n">${r.ast||'–'}</div>
      <button class="x" onclick="toggleEdit('${esc(r.w.id)}')" title="Add alert">🎯</button>
      <button class="x" onclick="rm('${esc(r.w.id)}')" title="Remove">×</button></div>${sub(r)}</div>`).join('');
  }
  renderSched();
}

function renderPicks(){
  const ord={in:0,pre:1,post:2};
  const list=games.filter(g=>picks[g.id]&&(g.status.type.state!=='post'||Date.now()-new Date(g.date)<36e5*30))
    .sort((a,b)=>ord[a.status.type.state]-ord[b.status.type.state]||new Date(a.date)-new Date(b.date));
  if(!list.length){$('picksBar').innerHTML='';return}
  $('picksBar').innerHTML='<div class="pbh">MY PICKS · TEAMS TO WIN</div><div class="pbl">'+list.map(g=>{
    const c=teamsOf(g),me=c.find(x=>x.team.id===picks[g.id]),op=c.find(x=>x!==me),st=g.status.type.state;
    const t=teams[me.team.id]||me.team,o=teams[op.team.id]||op.team;
    const oa=esc(o.abbr||o.abbreviation);
    let cls='pc',info;
    if(st==='in'){cls+=' live';info=`● ${me.score}-${op.score} · ${esc(g.status.type.shortDetail)}`}
    else if(st==='post'){const win=c.find(x=>x.winner)?.team.id===me.team.id;cls+=win?' ok':' bad';info=`${win?'✓ Won':'✗ Lost'} ${me.score}-${op.score} vs ${oa}`}
    else info=`${me.homeAway==='home'?'vs':'@'} ${oa} · ${new Date(g.date).toLocaleDateString([],{weekday:'short'})} ${fmtT(g.date)}`;
    return `<div class="${cls}">${t.logo?`<img src="${esc(t.logo)}" onerror="${imgErr}">`:''}<div><div class="pn">${esc(t.name||t.displayName||t.abbreviation)}</div><div class="pi">${info}</div></div>${st==='pre'?`<button title="Remove pick" onclick="pick('${g.id}','${me.team.id}')">×</button>`:''}</div>`;
  }).join('')+'</div>';
}

function renderSched(){
  renderPicks();
  const live=games.filter(g=>g.status.type.state==='in'),
        rest=games.filter(g=>g.status.type.state==='pre'),
        fin=games.filter(g=>g.status.type.state==='post'&&Date.now()-new Date(g.date)<36e5*30).reverse();
  const winOf=g=>teamsOf(g).find(x=>x.winner)?.team.id;
  const done=games.filter(g=>g.status.type.state==='post'&&picks[g.id]);
  const right=done.filter(g=>winOf(g)===picks[g.id]).length;
  $('rec').textContent=done.length?`PICKS ${right}/${done.length} ✓`:'';
  if(!live.length&&!rest.length&&!fin.length){$('sched').innerHTML='<div class="empty">No games found.</div>';return}
  const today=new Date().toDateString(),tom=new Date(Date.now()+864e5).toDateString();
  const card=g=>{
    const c=teamsOf(g),a=c.find(x=>x.homeAway==='away'),h=c.find(x=>x.homeAway==='home'),st=g.status.type.state,pk=picks[g.id];
    const mine=[a,h].reduce((n,x)=>n+watch.filter(w=>w.team===x.team.id).length,0);
    const row=x=>{
      const tid=x.team.id,t=teams[tid]||x.team,on=pk===tid,win=st==='post'&&winOf(g)===tid;
      let tag='';
      if(on)tag=st==='post'?(win?'<span class="pk ok">✓ PICK</span>':'<span class="pk bad">✗ PICK</span>'):'<span class="pk">PICK</span>';
      return `<div class="tm${on?' picked':''}${win?' win':''}" onclick="pick('${g.id}','${tid}')">${tImg(t)}<span class="ab">${esc(t.abbr||t.abbreviation)}</span>${tag}${st!=='pre'?`<span class="s">${x.score}</span>`:''}${win?'🏆':''}</div>`;
    };
    const time=st==='in'?'● '+esc(g.status.type.shortDetail):st==='post'?'Final':fmtT(g.date);
    return `<div class="g"><div>${row(a)}${row(h)}</div><div class="gt${st==='in'?' live':''}">${time}${mine?`<br><span class="dot">${mine} tracked</span>`:''}</div></div>`;
  };
  let html='',last='';
  if(live.length)html+='<div class="day">LIVE NOW</div>'+live.map(card).join('');
  rest.forEach(g=>{
    const ds=new Date(g.date).toDateString();
    if(ds!==last){last=ds;html+=`<div class="day">${ds===today?'TODAY':ds===tom?'TOMORROW':new Date(g.date).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}).toUpperCase()}</div>`}
    html+=card(g);
  });
  if(fin.length)html+='<div class="day">RECENT RESULTS</div>'+fin.map(card).join('');
  html+='<div class="tip">Tap a team in an upcoming game to pick the winner.</div>';
  $('sched').innerHTML=html;
}

/* search */
let sel=0,cur=[];
function suggest(){
  const q=$('inp').value.trim().toLowerCase(),box=$('sug');
  if(q.length<2){box.style.display='none';return}
  cur=players.filter(p=>p.name.toLowerCase().includes(q)&&!watch.some(w=>w.id===p.id)).slice(0,8);sel=0;
  box.innerHTML=cur.map((p,i)=>`<div class="sg${i?'':' on'}" data-i="${i}">
    <img class="face" src="${esc(p.img)}" onerror="${imgErr}">
    <div><b>${esc(p.name)}</b><div class="t">${tImg(teams[p.team])}${esc(teams[p.team]?.name||'')} ${p.pos?'· '+esc(p.pos):''}</div></div></div>`).join('')||'<div class="empty">No players found</div>';
  box.style.display='block';
}
function add(p){
  if(!p)return;
  watch.push({id:p.id,name:p.name,team:p.team});ls.set('nbaWatch2',watch);
  $('inp').value='';$('sug').style.display='none';render();
}
window.rm=id=>{watch=watch.filter(w=>w.id!==id);ls.set('nbaWatch2',watch);render()};
$('inp').addEventListener('input',suggest);
$('inp').addEventListener('keydown',e=>{
  const els=[...document.querySelectorAll('.sg')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(els.length-1,sel+(e.key==='ArrowDown'?1:-1)));els.forEach((x,i)=>x.classList.toggle('on',i===sel))}
  if(e.key==='Enter')add(cur[sel]);
  if(e.key==='Escape')$('sug').style.display='none';
});
$('sug').addEventListener('mousedown',e=>{const s=e.target.closest('.sg');if(s)add(cur[+s.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sug').style.display='none'});
$('sortBtn').onclick=()=>{sortMode=sortMode==='pts'?'added':'pts';ls.set('nbaSort',sortMode);render()};

(async()=>{
  render();
  try{await loadRosters()}catch(e){$('status').textContent='⚠ Could not load players'}
  watch=watch.map(w=>w.team?w:{...w,team:players.find(p=>p.id===w.id)?.team});
  await refresh();
  setInterval(refresh,20000);
})();
</script>
