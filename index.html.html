<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Live Player Tracker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e3e6ea;--accent:#e8590c;--live:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#f1f3f5;--muted:#9aa3af;--line:#2a2e37;--accent:#ff8a3d;--live:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
main{max-width:760px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.add{display:flex;gap:8px;margin-bottom:18px}
input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:1rem}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:16px}
.pts{font-size:2.6rem;font-weight:800;min-width:64px;text-align:center;color:var(--accent);line-height:1}
.pts small{display:block;font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:.08em}
.info{flex:1;min-width:0}
.name{font-weight:700}
.meta{color:var(--muted);font-size:.85rem;margin-top:2px}
.stats{font-size:.85rem;margin-top:6px}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.live{color:var(--live);border-color:var(--live)}
.x{background:none;color:var(--muted);padding:4px 8px;font-size:1.2rem}
.empty,.err{color:var(--muted);text-align:center;padding:30px 0}
.err{color:#dc2626}
</style>
</head>
<body>
<main>
  <h1>🏀 NBA Live Player Tracker</h1>
  <div class="sub" id="status">Loading today’s games…</div>
  <div class="add">
    <input id="inp" list="players" placeholder="Search a player (e.g. Luka Dončić)" autocomplete="off">
    <datalist id="players"></datalist>
    <button id="addBtn">Add</button>
  </div>
  <div class="grid" id="list"></div>
</main>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
let roster={};            // id -> {name, team}
let games=[];             // today's scoreboard events
let box={};               // eventId -> parsed boxscore players
let watch=[];
try{watch=JSON.parse(localStorage.getItem('nbaWatch')||'[]')}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('nbaWatch',JSON.stringify(watch))}catch(e){}};
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};

async function loadGames(){
  const d=await j(API+'/scoreboard');
  games=d.events||[];
  const teams=new Map();
  games.forEach(g=>g.competitions[0].competitors.forEach(c=>teams.set(c.team.id,c.team.abbreviation)));
  await Promise.all([...teams].map(async([id,abbr])=>{
    try{
      const r=await j(`${API}/teams/${id}/roster`);
      let a=r.athletes||[];
      if(a.length&&a[0].items)a=a.flatMap(x=>x.items);
      a.forEach(p=>roster[p.id]={name:p.displayName,team:abbr});
    }catch(e){}
  }));
  $('players').innerHTML=Object.values(roster).map(p=>`<option value="${p.name}">`).join('');
}

async function refresh(){
  try{
    const d=await j(API+'/scoreboard');
    games=d.events||[];
    await Promise.all(games.filter(g=>g.status.type.state!=='pre').map(async g=>{
      try{
        const s=await j(`${API}/summary?event=${g.id}`);
        const out={};
        (s.boxscore?.players||[]).forEach(t=>{
          const st=t.statistics?.[0];if(!st)return;
          const L=st.labels||[];
          (st.athletes||[]).forEach(a=>{
            const o={dnp:a.didNotPlay||!a.stats?.length};
            L.forEach((l,i)=>o[l]=a.stats?.[i]);
            out[a.athlete.id]=o;
          });
        });
        box[g.id]=out;
      }catch(e){}
    }));
    $('status').textContent='Updated '+new Date().toLocaleTimeString()+' · auto-refreshes every 20s';
  }catch(e){$('status').innerHTML='<span class="err">Could not reach ESPN. Check your connection.</span>'}
  render();
}

function render(){
  if(!watch.length){$('list').innerHTML='<div class="empty">Search and add players to follow their points live.</div>';return}
  $('list').innerHTML=watch.map(p=>{
    const g=games.find(g=>g.competitions[0].competitors.some(c=>c.team.abbreviation===p.team));
    let pts='–',badge='<span class="badge">No game today</span>',meta=p.team,stats='';
    if(g){
      const c=g.competitions[0].competitors;
      const home=c.find(x=>x.homeAway==='home'),away=c.find(x=>x.homeAway==='away');
      const state=g.status.type.state;
      meta=`${away.team.abbreviation} ${away.score||0} @ ${home.team.abbreviation} ${home.score||0}`;
      if(state==='pre'){
        badge='<span class="badge">'+new Date(g.date).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})+'</span>';
        meta=`${away.team.abbreviation} @ ${home.team.abbreviation}`;
      }else{
        badge=state==='in'?`<span class="badge live">● LIVE · ${g.status.type.shortDetail}</span>`:`<span class="badge">${g.status.type.shortDetail}</span>`;
        const b=box[g.id]?.[p.id];
        if(b&&!b.dnp){pts=b.PTS??0;stats=`${b.REB??0} REB · ${b.AST??0} AST · ${b.MIN??0} MIN · FG ${b.FG??'-'}`}
        else if(b)stats='Did not play';
        else stats='Not in boxscore yet';
        if(b&&!b.dnp)pts=b.PTS;
      }
    }
    return `<div class="card"><div class="pts">${pts}<small>PTS</small></div>
      <div class="info"><div class="name">${p.name} <span class="meta">· ${p.team}</span></div>
      <div class="meta">${meta}</div><div class="stats">${stats}</div><div style="margin-top:6px">${badge}</div></div>
      <button class="x" onclick="rm('${p.id}')" title="Remove">×</button></div>`;
  }).join('');
}

function add(){
  const v=$('inp').value.trim().toLowerCase();if(!v)return;
  const id=Object.keys(roster).find(i=>roster[i].name.toLowerCase()===v)||
           Object.keys(roster).find(i=>roster[i].name.toLowerCase().includes(v));
  if(!id){alert('Player not found among teams playing today.');return}
  if(!watch.some(p=>p.id===id))watch.push({id,...roster[id]});
  save();$('inp').value='';render();
}
window.rm=id=>{watch=watch.filter(p=>p.id!==id);save();render()};
$('addBtn').onclick=add;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')add()});

(async()=>{
  try{await loadGames()}catch(e){$('status').innerHTML='<span class="err">Could not load games from ESPN.</span>'}
  await refresh();
  setInterval(refresh,20000);
})();
</script>
</body>
</html>
