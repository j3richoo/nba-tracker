<!DOCTYPE html>
<html lang="en">
<head>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('nbaTheme'))||'night'}catch(e){document.documentElement.dataset.theme='night'}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Live Player Tracker</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#111113;--card2:#18181b;--text:#fafafa;--muted:#a1a1aa;--line:#27272a;--accent:#e4e4e7;--accent2:#fafafa;--live:#4ade80;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.4);--on:#09090b;--tint:var(--tint);--ring:var(--ring);--g1:rgba(255,255,255,.06);--g2:rgba(255,255,255,.035)}
:root[data-theme="day"]{color-scheme:light;--bg:#f4f4f5;--card:#fff;--card2:#f4f4f5;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#27272a;--accent2:#18181b;--live:#16a34a;--bad:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.08);--on:#fafafa;--tint:rgba(0,0,0,.06);--ring:rgba(0,0,0,.12);--g1:rgba(0,0,0,.05);--g2:rgba(0,0,0,.025)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;background:var(--bg) radial-gradient(900px 380px at 15% -10%,var(--g1),transparent 60%),radial-gradient(700px 320px at 95% 0,var(--g2),transparent 60%) no-repeat;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:1.1rem;box-shadow:0 6px 16px var(--ring)}
h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
#status{color:var(--muted);font-size:.74rem;background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:0 20px 28px;max-width:1180px;margin:0 auto;align-items:start}
@media(max-width:880px){.layout{grid-template-columns:1fr;padding:0 12px 24px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
.ph button{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 12px;font-size:.7rem;cursor:pointer;font-weight:600}
#rec{color:var(--live)}
.search{position:relative;padding:12px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);font-size:.95rem;outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
#sug,#psug,#tsug,#mtsug{position:absolute;left:14px;right:14px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:10;display:none;max-height:360px;overflow:auto;padding:4px}
.sg{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;border-radius:10px}
.sg:hover,.sg.on{background:var(--card2)}
.sg .t{color:var(--muted);font-size:.75rem;display:flex;align-items:center;gap:4px}
.face{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.tl{width:16px;height:16px;object-fit:contain;flex:none}
.hd,.row{display:grid;grid-template-columns:36px minmax(0,1fr) 46px 34px 34px 42px 22px;gap:8px;align-items:center;padding:8px 14px}
.hd{font-size:.62rem;color:var(--muted);font-weight:700;text-align:center;letter-spacing:.08em;padding-top:6px;padding-bottom:6px}
.wrap{border-top:1px solid var(--line);transition:background .2s}
.wrap:hover{background:var(--card2)}
.wrap.hit{background:linear-gradient(90deg,rgba(16,185,129,.16),rgba(16,185,129,.04))}
.hit .nm{color:var(--live)}
.who{min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.gm{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gm.live{color:var(--live);font-weight:600}
.n{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.n.pts{font-size:1.3rem;font-weight:800;color:var(--accent2)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;padding:0;opacity:.75;transition:.15s}
.x:hover{opacity:1;transform:scale(1.15)}
.empty{color:var(--muted);text-align:center;padding:30px 14px}
.sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 10px 58px;font-size:.72rem}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;color:var(--muted);background:var(--card2)}
.chip.ok{border-color:var(--live);color:var(--live);font-weight:700}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 4px;font-size:.85rem}
.ed{width:100%;display:flex;flex-direction:column;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--muted)}
.edr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ed select,.ed input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:.8rem}
.ed input{width:60px}
.add{background:var(--text);color:var(--on);border:0;border-radius:8px;padding:5px 14px;font-weight:700;cursor:pointer}
.qk{display:flex;flex-wrap:wrap;gap:5px}
.q{min-width:34px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;font-size:.78rem;cursor:pointer;transition:.12s}
.q:hover{border-color:var(--accent);color:var(--accent)}
.q.on{background:var(--live);border-color:var(--live);color:#fff}
.day{padding:8px 14px;font-size:.66rem;font-weight:800;color:var(--muted);letter-spacing:.1em;background:var(--card2);border-top:1px solid var(--line)}
.g{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.tm{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.84rem;cursor:pointer;transition:.12s}
.tm:hover{background:var(--card2)}
.tm.picked{border-color:var(--accent);background:var(--tint)}
.tm.win .ab{color:var(--live)}
.tm .s{margin-left:auto;font-variant-numeric:tabular-nums}
.pk{font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--text);color:var(--on);letter-spacing:.04em}
.pk.ok{background:var(--live)}.pk.bad{background:var(--bad)}
.gt{font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap;padding-right:4px}
.gt.live{color:var(--live);font-weight:700}
.dot{display:inline-block;background:var(--text);color:var(--on);border-radius:99px;font-size:.62rem;padding:1px 7px;margin-top:4px}
.tip{padding:8px 14px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--line)}
#picksBar{max-width:1180px;margin:0 auto 14px;padding:0 20px}
#picksBar:empty{display:none}
@media(max-width:880px){#picksBar{padding:0 12px}}
.pbh{font-size:.66rem;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:0 2px 8px}
.pbl{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pc{flex:none;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.pc img{width:40px;height:40px;object-fit:contain}
.pc .pn{font-weight:800}
.pc .pi{font-size:.72rem;color:var(--muted);margin-top:2px;white-space:nowrap}
.pc.live{border-color:var(--live)}.pc.live .pi{color:var(--live);font-weight:700}
.pc.ok{border-color:var(--live);background:linear-gradient(90deg,rgba(52,211,153,.14),var(--card))}.pc.ok .pi{color:var(--live);font-weight:700}
.pc.bad{border-color:var(--bad)}.pc.bad .pi{color:var(--bad);font-weight:700}
.pc button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 0 0 2px}
.ah{font-size:.58rem;font-weight:800;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:1.5}
#nav{display:flex;gap:4px;max-width:1180px;margin:0 auto 14px;padding:0 20px;overflow-x:auto}
#nav button{background:none;border:0;color:var(--muted);padding:8px 15px;border-radius:99px;font-weight:600;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:.2s}
#nav button:hover{color:var(--text);background:var(--card)}
#nav button.on{background:var(--text);color:var(--on)}
.view{display:none}.view.on{display:block;animation:rise .35s ease}
.wide{max-width:1180px;margin:0 auto;padding:0 20px 28px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.4}}@keyframes grow{from{width:0}}@keyframes shim{to{background-position:-200% 0}}
.gt.live{animation:pulse 2s infinite}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:880px){.two{grid-template-columns:1fr}#nav,.wide{padding-left:12px;padding-right:12px}}
select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font-size:.85rem}
.sc{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:.8rem}
.tb th{font-size:.62rem;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:center;padding:10px 6px}
.tb td{padding:8px 6px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tb td:nth-child(2),.tb th:nth-child(2){text-align:left}
.tb tbody tr{animation:rise .4s ease both;animation-delay:calc(var(--i,0)*25ms);transition:background .15s}
.tb tbody tr:hover{background:var(--card2)}
.pt td:nth-child(2),.pt th:nth-child(2){text-align:center}
.tb .cut td{border-top:1px dashed var(--muted)}
.tmc{display:flex;align-items:center;gap:8px;font-weight:700}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text);animation:grow .9s ease both}
.sk{height:130px;margin:14px;border-radius:14px;background:linear-gradient(90deg,var(--card2) 25%,var(--line) 50%,var(--card2) 75%);background-size:200% 100%;animation:shim 1.2s infinite}
.ph0{display:flex;gap:14px;align-items:center;padding:16px 14px;flex-wrap:wrap}
.ph0 .face{width:68px;height:68px}.ph0 .nm{font-size:1.2rem}
.ph0 .add{margin-left:auto;padding:8px 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;padding:0 14px 14px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*45ms);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--muted)}
.tile b{display:block;font-size:1.5rem}.tile span{font-size:.62rem;letter-spacing:.1em;color:var(--muted)}
.h2f{display:flex;gap:10px;align-items:center;padding:14px;flex-wrap:wrap}
.hs{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:center;padding:6px 14px 16px;text-align:center}
.hs .tmc{flex-direction:column;gap:4px}.hs .tmc img{width:56px;height:56px}
.hs big{font-size:2.4rem;font-weight:800}
.ig{animation:rise .4s ease both}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;padding:14px}
.tc{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 8px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:.75rem;text-align:center;animation:rise .4s ease both;animation-delay:calc(var(--i,0)*20ms);transition:transform .2s,border-color .2s}
.tc:hover{transform:translateY(-3px);border-color:var(--muted)}
.tc img{width:46px;height:46px}
.tile em{display:block;font-style:normal;font-size:.62rem;color:var(--muted);margin-top:2px}
.cl{cursor:pointer}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.betb{background:var(--text);color:var(--on);border:0;border-radius:99px;font-size:.66rem;font-weight:800;padding:4px 0;cursor:pointer;transition:transform .15s}
.betb:hover{transform:scale(1.08)}
.chip.bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:4px 12px;font-weight:700;cursor:pointer;font-size:.78rem}
.seg button.on{background:var(--text);color:var(--on)}
.tl2{width:36px;height:36px;object-fit:contain}
.slots{display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;align-items:center;padding:16px 14px 6px}
.slot{min-height:136px;border:2px dashed var(--line);border-radius:20px;display:grid;place-items:center;transition:.25s;color:var(--muted);font-weight:600}
.slot.f{border-style:solid;border-color:var(--muted);background:var(--card2)}
.slotin{text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.slotin img{width:76px;height:76px;object-fit:contain}.slotin b{display:block;margin-top:6px}
.vs{font-weight:800;color:var(--muted);text-align:center}
.h2g{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
.lg{background:var(--card2);border:2px solid transparent;border-radius:14px;padding:9px;cursor:pointer;display:grid;place-items:center;animation:rise .4s ease both;animation-delay:calc(var(--i,0)*15ms);transition:transform .15s,border-color .2s}
.lg:hover{transform:translateY(-3px) scale(1.08)}
.lg.a{border-color:var(--text)}.lg.b{border-color:var(--live)}
.lg img{width:40px;height:40px;object-fit:contain}
.cmp{display:grid;grid-template-columns:60px 1fr 60px;gap:10px;align-items:center;padding:7px 14px;animation:rise .4s ease both;animation-delay:calc(var(--i,0)*60ms)}
.cmp b{font-size:1.05rem;text-align:center}
.cb{display:flex;gap:2px;height:8px;margin-top:4px}
.cb i{display:block;background:var(--text);border-radius:99px;animation:grow .9s ease both}.cb i.r{background:var(--muted)}
.gl thead th{position:sticky;top:0;background:var(--card);z-index:1}
.av{width:50px;height:50px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--muted);position:relative;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.it{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--line);align-items:flex-start;transition:background .15s}
.it:hover{background:var(--card2)}
.inj{font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);letter-spacing:.04em}
.inj.o{color:var(--bad);border-color:var(--bad)}.inj.d{color:#fbbf24;border-color:#fbbf24}
.h2b{margin-top:4px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;font-size:.62rem;font-weight:700;padding:1px 8px;cursor:pointer}
.h2b:hover{color:var(--text);border-color:var(--muted)}
.wrap,.pc,.g{transition:background .2s,transform .2s}
#pickPop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.62);backdrop-filter:blur(6px);z-index:100;cursor:pointer}
#pickPop.show{display:flex;animation:fade .18s ease}
.pp{background:var(--card);border:1px solid var(--accent);border-radius:24px;padding:28px 40px;text-align:center;box-shadow:0 0 0 6px var(--tint),0 30px 80px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.pp img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.pp .k{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--accent);margin-top:10px}
.pp .t{font-size:1.5rem;font-weight:800;margin-top:4px}
.pp .m{font-size:.8rem;color:var(--muted);margin-top:6px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#themeBtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:5px 12px;font-size:.74rem;font-weight:600;cursor:pointer;transition:.2s}
#themeBtn:hover{border-color:var(--muted);transform:translateY(-1px)}
body,.panel,.search input,select,.tile,.tc,.pc,#status,#nav button{transition:background-color .3s,border-color .3s,color .3s}
</style>
</head>
<body>
<div id="pickPop" onclick="this.classList.remove('show')"></div>
<header><div class="brand"><span class="logo">🏀</span><h1>NBA Live Tracker</h1></div><div style="display:flex;gap:8px;align-items:center"><div id="status">Loading…</div><button id="themeBtn" onclick="toggleTheme()"></button></div></header>
<nav id="nav"></nav>
<div class="view on" id="v-tracker">
<div id="picksBar"></div>
<div class="layout">
  <div class="col">
  <section class="panel">
    <div class="search">
      <input id="inp" placeholder="Search any NBA player…" autocomplete="off">
      <div id="sug"></div>
    </div>
    <div class="ph"><span>MY PLAYERS (<span id="cnt">0</span>)</span><button id="sortBtn"></button></div>
    <div class="hd"><span></span><span style="text-align:left">PLAYER</span><span>PTS</span><span>REB</span><span>AST</span><span></span><span></span></div>
    <div id="list"></div>
  </section>
  <section class="panel"><div class="search"><input id="mtin" placeholder="Add a team to follow…" autocomplete="off"><div id="mtsug"></div></div>
    <div class="ph"><span>MY TEAMS (<span id="tcnt">0</span>)</span></div>
    <div class="hd"><span></span><span style="text-align:left">TEAM</span><span>PTS</span><span>OPP</span><span>H/A</span><span></span><span></span></div>
    <div id="tlist"></div></section>
  </div>
  <aside class="panel">
    <div class="ph"><span>GAMES · NEXT 3 DAYS</span><span id="rec"></span></div>
    <div id="sched"></div>
  </aside>
</div>
</div>
<div class="view" id="v-players"><div class="wide"><div class="panel"><div class="search"><input id="pin" placeholder="Search any player's stats…" autocomplete="off"><div id="psug"></div></div><div id="pres"><div class="empty">Search a player to see their season stats.</div></div></div></div></div>
<div class="view" id="v-teams"><div class="wide"><div class="panel"><div class="search"><input id="tin" placeholder="Search a team…" autocomplete="off"><div id="tsug"></div></div><div id="tres"></div></div></div></div>
<div class="view" id="v-standings"><div class="wide" id="stand"></div></div>
<div class="view" id="v-h2h"><div class="wide"><div class="panel"><div class="ph"><span>HEAD TO HEAD</span><button onclick="h2hSwap()">⇄ Swap</button></div><div class="slots"><div class="slot" id="sA"></div><div class="vs">VS</div><div class="slot" id="sB"></div></div><div class="tip" style="border:0;text-align:center">Tap two team logos to compare them</div><div class="tg h2g" id="hgrid"></div><div id="hres"></div></div></div></div>
<div class="view" id="v-injuries"><div class="wide"><div class="panel"><div class="search" style="display:flex;gap:8px"><select id="ifil" onchange="renderInj()"></select><input id="iin" placeholder="Filter by player…" oninput="renderInj()" style="flex:1"></div><div id="inj"></div></div></div></div>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const j=async(path,params={},b='site')=>{const q=new URLSearchParams({p:'basketball/nba/'+path,b,...params});const r=await fetch('/api/espn?'+q);if(!r.ok)throw new Error(r.status);return r.json()};
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let teams={},players=[],games=[],box={};
const STATS={PTS:'Points',REB:'Rebounds',AST:'Assists',PRA:'Pts+Reb+Ast',STL:'Steals',BLK:'Blocks','3PM':'3PT made',TO:'Turnovers'},TS={PTS:'Team points'};
const val=(b,k)=>k==='3PM'?(parseInt(b['3PT'])||0):k==='PRA'?(+b.PTS||0)+(+b.REB||0)+(+b.AST||0):(+b[k]||0);
const LINES={PTS:[5,10,15,20,25,30,35,40,45,50],PRA:[10,15,20,25,30,35,40,45,50],REB:[2,4,6,8,10,12,14,16],AST:[2,4,6,8,10,12,14,16],STL:[1,2,3,4,5],BLK:[1,2,3,4,5],'3PM':[1,2,3,4,5,6,7,8],TO:[1,2,3,4,5,6]};
let teamsW=ls.get('nbaTeams',[]);
let editId=null,draft={stat:'PTS',min:10,dir:'o'},picks=ls.get('nbaPicks',{});
let watch=ls.get('nbaWatch2',[]),sortMode=ls.get('nbaSort','pts');
const face=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const imgErr="this.onerror=null;this.style.visibility='hidden'";
const tImg=t=>t?.logo?`<img class="tl" src="${esc(t.logo)}" onerror="${imgErr}">`:'';
const fmtT=d=>new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

async function loadRosters(){
  const c=ls.get('nbaRoster',null);
  if(c&&Date.now()-c.t<864e5){teams=c.teams;players=c.players;return}
  const d=await j('teams');
  d.sports[0].leagues[0].teams.forEach(({team:t})=>teams[t.id]={id:t.id,abbr:t.abbreviation,logo:t.logos?.[0]?.href,name:t.displayName});
  await Promise.all(Object.keys(teams).map(async id=>{
    try{
      const r=await j(`teams/${id}/roster`);
      let a=r.athletes||[];if(a.length&&a[0].items)a=a.flatMap(x=>x.items);
      a.forEach(p=>players.push({id:p.id,name:p.displayName,team:id,pos:p.position?.abbreviation||'',img:p.headshot?.href||face(p.id)}));
    }catch(e){}
  }));
  ls.set('nbaRoster',{t:Date.now(),teams,players});
}

async function refresh(){
  try{
    const days=[-1,0,1,2,3].map(n=>ymd(new Date(Date.now()+n*864e5)));
    const res=await Promise.all(days.map(d=>j('scoreboard',{dates:d,limit:100}).catch(()=>({events:[]}))));
    const seen=new Set();
    games=res.flatMap(r=>r.events||[]).filter(g=>!seen.has(g.id)&&seen.add(g.id)).sort((x,y)=>new Date(x.date)-new Date(y.date));
    if(!games.length)throw new Error('no data');
    await Promise.all(games.filter(g=>g.status.type.state!=='pre'&&Date.now()-new Date(g.date)<36e5*30).map(async g=>{
      try{
        const s=await j('summary',{event:g.id}),out={};
        (s.boxscore?.players||[]).forEach(t=>{
          const st=t.statistics?.[0];if(!st)return;
          (st.athletes||[]).forEach(p=>{
            const o={dnp:p.didNotPlay||!p.stats?.length};
            (st.labels||[]).forEach((l,i)=>o[l]=p.stats?.[i]);
            out[p.athlete.id]=o;
          });
        });
        box[g.id]=out;
      }catch(e){}
    }));
    $('status').textContent='Updated '+new Date().toLocaleTimeString()+' · refreshes every 20s';
  }catch(e){$('status').textContent='⚠ Could not reach ESPN'}
  render();
}

const teamsOf=g=>g.competitions[0].competitors;
function pickGame(tid){
  const m=games.filter(g=>teamsOf(g).some(c=>c.team.id===tid));
  return m.find(g=>g.status.type.state==='in')
    ||[...m].reverse().find(g=>g.status.type.state==='post'&&Date.now()-new Date(g.date)<36e5*14)
    ||m.find(g=>g.status.type.state==='pre')
    ||m[m.length-1];
}

function rowData(w){
  const g=pickGame(w.team),t=teams[w.team];
  const r={w,t,rules:(w.rules||[]).map(x=>({...x,v:null,ok:false})),hit:false,pts:null,reb:'',ast:'',gm:'No game in next 3 days',live:false,state:'none'};
  if(!g)return r;
  const c=teamsOf(g),h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');
  const ab=x=>teams[x.team.id]?.abbr||x.team.abbreviation,state=g.status.type.state;
  r.state=state;
  if(state==='pre'){
    const day=new Date(g.date).toLocaleDateString([],{weekday:'short'});
    r.gm=`${ab(a)} @ ${ab(h)} · ${day} ${fmtT(g.date)}`;
  }else{
    r.live=state==='in';
    r.gm=`${ab(a)} ${a.score} @ ${ab(h)} ${h.score} · ${g.status.type.shortDetail}`;
    const b=box[g.id]?.[w.id];
    if(b&&!b.dnp){r.b=b;r.pts=+b.PTS||0;r.reb=b.REB??'';r.ast=b.AST??''}
    else if(b)r.gm+=' · DNP';
  }
  if(r.b){r.rules=r.rules.map(x=>{const v=val(r.b,x.stat),u=x.dir==='u';return {...x,v,ok:u?(r.state==='post'&&v<x.min):v>=x.min,lost:u&&v>=x.min}});r.hit=r.rules.some(x=>x.ok)}
  return r;
}

const ent=(k,id)=>k==='p'?watch.find(x=>x.id===id):teamsW.find(x=>x.id===id);
const saveW=k=>k==='p'?ls.set('nbaWatch2',watch):ls.set('nbaTeams',teamsW);
function betUI(k,id,rs,pre){
  const names=k==='p'?STATS:TS,st=k==='t'?'PTS':(STATS[draft.stat]?draft.stat:'PTS');
  const chips=(pre||'')+rs.map((x,i)=>`<span class="chip${x.ok?' ok':x.lost?' bad':''}">${x.ok?'✓ ':x.lost?'✗ ':''}${esc(names[x.stat]||x.stat)} ${x.dir==='u'?'Under':'Over'} ${x.min}${x.v!=null?' ('+x.v+')':''}<button onclick="rmRule('${k}','${id}',${i})" title="Remove bet">×</button></span>`).join('');
  let ed='';
  if(editId===k+id){
    const have=((ent(k,id)||{}).rules||[]).filter(x=>x.stat===st&&(x.dir||'o')===draft.dir).map(x=>x.min);
    const lines=k==='p'?LINES[st]:[90,95,100,105,110,115,120,125,130,135,140];
    const qk=lines.map(n=>`<button class="q${have.includes(n)?' on':''}" onclick="quick('${k}','${id}',${n})">${draft.dir==='o'?n+'+':'<'+n}</button>`).join('');
    ed=`<div class="ed"><div class="edr"><div class="seg"><button class="${draft.dir==='o'?'on':''}" onclick="draft.dir='o';render(true)">Over</button><button class="${draft.dir==='u'?'on':''}" onclick="draft.dir='u';render(true)">Under</button></div>${k==='p'?`<select onchange="draft.stat=this.value;render(true)">${Object.entries(STATS).map(([a,n])=>`<option value="${a}"${st===a?' selected':''}>${n}</option>`).join('')}</select>`:'<span>Team points</span>'}<input type="number" min="1" value="${draft.min}" oninput="draft.min=+this.value" onkeydown="if(event.key==='Enter')addRule('${k}','${id}')"><button class="add" onclick="addRule('${k}','${id}')">Place bet</button></div><div class="qk">${qk}</div>${k==='t'?`<div class="qk"><button class="q" onclick="winPick('${id}')">🏆 Pick to win</button></div>`:''}</div>`;
  }
  return chips||ed?`<div class="sub">${chips}${ed}</div>`:'';
}
function sub(r){return betUI('p',r.w.id,r.rules)}
window.toggleEdit=(k,id)=>{const key=k+id;editId=editId===key?null:key;if(editId)draft.min=k==='t'?110:10;render();setTimeout(()=>document.querySelector('.ed input')?.focus(),0)};
window.addRule=(k,id)=>{const w=ent(k,id);if(!w||!(draft.min>0))return;w.rules=(w.rules||[]).concat({stat:k==='t'?'PTS':draft.stat,min:draft.min,dir:draft.dir});saveW(k);editId=null;render()};
window.quick=(k,id,n)=>{const w=ent(k,id);if(!w)return;const st=k==='t'?'PTS':draft.stat,rs=w.rules||[],i=rs.findIndex(x=>x.stat===st&&x.min===n&&(x.dir||'o')===draft.dir);w.rules=i>=0?rs.filter((_,q)=>q!==i):rs.concat({stat:st,min:n,dir:draft.dir});saveW(k);render()};
window.pick=(gid,tid)=>{
  const g=games.find(x=>x.id===gid);if(!g||g.status.type.state!=='pre')return;
  if(picks[gid]===tid)delete picks[gid];else picks[gid]=tid;
  ls.set('nbaPicks',picks);renderSched();
  if(picks[gid]){
    const c=teamsOf(g),a=c.find(x=>x.homeAway==='away'),h=c.find(x=>x.homeAway==='home');
    const ab=x=>teams[x.team.id]?.abbr||x.team.abbreviation,t=teams[tid]||c.find(x=>x.team.id===tid).team;
    const pop=$('pickPop');
    pop.innerHTML=`<div class="pp">${t.logo?`<img src="${esc(t.logo)}" onerror="${imgErr}">`:''}<div class="k">YOUR PICK TO WIN · ${c.find(x=>x.team.id===tid).homeAway==='home'?'HOME':'AWAY'}</div><div class="t">${esc(t.name||t.displayName||t.abbreviation)}</div><div class="m">${esc(ab(a))} @ ${esc(ab(h))} · ${fmtT(g.date)}</div></div>`;
    pop.classList.add('show');
    clearTimeout(window._pp);window._pp=setTimeout(()=>pop.classList.remove('show'),2200);
  }
};
window.rmRule=(k,id,i)=>{const w=ent(k,id);if(!w)return;w.rules.splice(i,1);saveW(k);render()};
window.winPick=id=>{const g=pickGame(id);if(g&&g.status.type.state==='pre')pick(g.id,id);else alert('You can only pick a winner before the game starts.');render()};


function render(force){
  if(!force&&editId&&/^(INPUT|SELECT)$/.test(document.activeElement.tagName)&&$('list').contains(document.activeElement))return renderSched();
  $('cnt').textContent=watch.length;
  $('sortBtn').textContent=sortMode==='pts'?'Sort: Points':'Sort: Added';
  if(!watch.length)$('list').innerHTML='<div class="empty">Search a player above to start tracking.</div>';
  else{
    let rows=watch.map(rowData);
    if(sortMode==='pts')rows.sort((a,b)=>(b.live-a.live)||((b.pts??-1)-(a.pts??-1)));
    $('list').innerHTML=rows.map(r=>`<div class="wrap${r.hit?' hit':''}"><div class="row">
      <img class="face" src="${esc(face(r.w.id))}" onerror="${imgErr}">
      <div class="who"><div class="nm">${esc(r.w.name)} ${tImg(r.t)}${injB(r.w.id)}</div>
      <div class="gm${r.live?' live':''}">${r.live?'● ':''}${esc(r.gm)}</div></div>
      <div class="n pts">${r.pts??'–'}</div><div class="n">${r.reb||'–'}</div><div class="n">${r.ast||'–'}</div>
      <button class="betb" onclick="toggleEdit('p','${esc(r.w.id)}')">Bet</button>
      <button class="x" onclick="rm('${esc(r.w.id)}')" title="Remove">×</button></div>${sub(r)}</div>`).join('');
  }
  renderSched();
}

function renderPicks(){
  const ord={in:0,pre:1,post:2};
  const list=games.filter(g=>picks[g.id]&&(g.status.type.state!=='post'||Date.now()-new Date(g.date)<36e5*30))
    .sort((a,b)=>ord[a.status.type.state]-ord[b.status.type.state]||new Date(a.date)-new Date(b.date));
  if(!list.length){$('picksBar').innerHTML='';return}
  $('picksBar').innerHTML='<div class="pbh">MY PICKS · TEAMS TO WIN</div><div class="pbl">'+list.map(g=>{
    const c=teamsOf(g),me=c.find(x=>x.team.id===picks[g.id]),op=c.find(x=>x!==me),st=g.status.type.state;
    const t=teams[me.team.id]||me.team,o=teams[op.team.id]||op.team;
    const oa=esc(o.abbr||o.abbreviation);
    let cls='pc',info;
    if(st==='in'){cls+=' live';info=`● ${me.score}-${op.score} · ${esc(g.status.type.shortDetail)}`}
    else if(st==='post'){const win=c.find(x=>x.winner)?.team.id===me.team.id;cls+=win?' ok':' bad';info=`${win?'✓ Won':'✗ Lost'} ${me.score}-${op.score} vs ${oa}`}
    else info=`${me.homeAway==='home'?'vs':'@'} ${oa} · ${new Date(g.date).toLocaleDateString([],{weekday:'short'})} ${fmtT(g.date)}`;
    return `<div class="${cls}">${t.logo?`<img src="${esc(t.logo)}" onerror="${imgErr}">`:''}<div><div class="pn">${esc(t.name||t.displayName||t.abbreviation)} <span class="ah">${me.homeAway==='home'?'HOME':'AWAY'}</span></div><div class="pi">${info}</div></div>${st==='pre'?`<button title="Remove pick" onclick="pick('${g.id}','${me.team.id}')">×</button>`:''}</div>`;
  }).join('')+'</div>';
}

function teamRow(w){
  const t=teams[w.id];if(!t)return null;
  const r={w,t,pts:null,opp:null,gm:'No game in next 3 days',live:false,ha:'',hit:false,pre:'',rules:(w.rules||[]).map(x=>({...x,v:null,ok:false}))};
  const g=pickGame(w.id);if(!g)return r;
  const c=teamsOf(g),me=c.find(x=>x.team.id===w.id),op=c.find(x=>x!==me),a=c.find(x=>x.homeAway==='away'),h=c.find(x=>x.homeAway==='home');
  const st=g.status.type.state,ab=x=>teams[x.team.id]?.abbr||x.team.abbreviation;
  r.ha=me.homeAway==='home'?'H':'A';
  if(st==='pre')r.gm=`${ab(a)} @ ${ab(h)} · ${new Date(g.date).toLocaleDateString([],{weekday:'short'})} ${fmtT(g.date)}`;
  else{
    r.live=st==='in';r.pts=+me.score;r.opp=+op.score;r.gm=`${ab(a)} ${a.score} @ ${ab(h)} ${h.score} · ${g.status.type.shortDetail}`;
    r.rules=r.rules.map(x=>{const v=r.pts,u=x.dir==='u';return {...x,v,ok:u?(st==='post'&&v<x.min):v>=x.min,lost:u&&v>=x.min}});
  }
  const won=st==='post'&&c.find(x=>x.winner)?.team.id===w.id;
  if(picks[g.id]===w.id){r.pre=`<span class="chip${won?' ok':st==='post'?' bad':''}">🏆 To win${won?' ✓':st==='post'?' ✗':''}</span>`;if(won)r.hit=true}
  if(r.rules.some(x=>x.ok))r.hit=true;
  return r;
}
function renderTeams(){
  const ae=document.activeElement;if(/^(INPUT|SELECT)$/.test(ae.tagName)&&$('tlist').contains(ae))return;
  $('tcnt').textContent=teamsW.length;
  if(!teamsW.length){$('tlist').innerHTML='<div class="empty">Add a team above to follow its score and game time.</div>';return}
  const rows=teamsW.map(teamRow).filter(Boolean).sort((a,b)=>b.live-a.live);
  $('tlist').innerHTML=rows.map(r=>`<div class="wrap${r.hit?' hit':''}"><div class="row">
    ${r.t.logo?`<img class="tl2" src="${esc(r.t.logo)}" onerror="${imgErr}">`:'<div></div>'}
    <div class="who cl" onclick="goTeam('${r.w.id}')"><div class="nm">${esc(r.t.name)}</div><div class="gm${r.live?' live':''}">${r.live?'● ':''}${esc(r.gm)}</div></div>
    <div class="n pts">${r.pts??'–'}</div><div class="n">${r.opp??'–'}</div><div class="n">${r.ha}</div>
    <button class="betb" onclick="toggleEdit('t','${r.w.id}')">Bet</button>
    <button class="x" onclick="rmTeam('${r.w.id}')" title="Remove">×</button></div>${betUI('t',r.w.id,r.rules,r.pre)}</div>`).join('');
}
const mtin=$('mtin'),mtsug=$('mtsug');let mc=[];
mtin.addEventListener('input',()=>{
  const q=mtin.value.trim().toLowerCase();if(!q){mtsug.style.display='none';return}
  mc=Object.values(teams).filter(t=>(t.name.toLowerCase().includes(q)||t.abbr.toLowerCase()===q)&&!teamsW.some(w=>w.id===t.id)).slice(0,8);
  mtsug.innerHTML=mc.map((t,i)=>`<div class="sg" data-i="${i}">${t.logo?`<img class="face" style="border-radius:8px;object-fit:contain" src="${esc(t.logo)}" onerror="${imgErr}">`:''}<b>${esc(t.name)}</b></div>`).join('')||'<div class="empty">No teams found</div>';
  mtsug.style.display='block';
});
const addTeam=t=>{if(!t)return;teamsW.push({id:t.id,rules:[]});ls.set('nbaTeams',teamsW);mtin.value='';mtsug.style.display='none';renderTeams()};
mtsug.addEventListener('mousedown',e=>{const x=e.target.closest('.sg');if(x)addTeam(mc[+x.dataset.i])});
mtin.addEventListener('keydown',e=>{if(e.key==='Enter')addTeam(mc[0])});
window.rmTeam=id=>{teamsW=teamsW.filter(w=>w.id!==id);ls.set('nbaTeams',teamsW);renderTeams()};
window.trackT=id=>{const i=teamsW.findIndex(w=>w.id===id);if(i>=0)teamsW.splice(i,1);else teamsW.push({id,rules:[]});ls.set('nbaTeams',teamsW);renderTeams();$('ttrk').textContent=i>=0?'+ Track team':'✓ Tracking'};

function renderSched(){
  renderTeams();
  renderPicks();
  const live=games.filter(g=>g.status.type.state==='in'),
        rest=games.filter(g=>g.status.type.state==='pre'),
        fin=games.filter(g=>g.status.type.state==='post'&&Date.now()-new Date(g.date)<36e5*30).reverse();
  const winOf=g=>teamsOf(g).find(x=>x.winner)?.team.id;
  const done=games.filter(g=>g.status.type.state==='post'&&picks[g.id]);
  const right=done.filter(g=>winOf(g)===picks[g.id]).length;
  $('rec').textContent=done.length?`PICKS ${right}/${done.length} ✓`:'';
  if(!live.length&&!rest.length&&!fin.length){$('sched').innerHTML='<div class="empty">No games found.</div>';return}
  const today=new Date().toDateString(),tom=new Date(Date.now()+864e5).toDateString();
  const card=g=>{
    const c=teamsOf(g),a=c.find(x=>x.homeAway==='away'),h=c.find(x=>x.homeAway==='home'),st=g.status.type.state,pk=picks[g.id];
    const mine=[a,h].reduce((n,x)=>n+watch.filter(w=>w.team===x.team.id).length,0);
    const row=x=>{
      const tid=x.team.id,t=teams[tid]||x.team,on=pk===tid,win=st==='post'&&winOf(g)===tid;
      let tag='';
      if(on)tag=st==='post'?(win?'<span class="pk ok">✓ PICK</span>':'<span class="pk bad">✗ PICK</span>'):'<span class="pk">PICK</span>';
      return `<div class="tm${on?' picked':''}${win?' win':''}" onclick="pick('${g.id}','${tid}')">${tImg(t)}<span class="ab">${esc(t.abbr||t.abbreviation)}</span><span class="ah">${x.homeAway==='home'?'HOME':'AWAY'}</span>${tag}${st!=='pre'?`<span class="s">${x.score}</span>`:''}${win?'🏆':''}</div>`;
    };
    const time=st==='in'?'● '+esc(g.status.type.shortDetail):st==='post'?'Final':fmtT(g.date);
    return `<div class="g"><div>${row(a)}${row(h)}</div><div class="gt${st==='in'?' live':''}">${time}<br><button class="h2b" onclick="goH2H('${a.team.id}','${h.team.id}')">H2H</button>${mine?`<br><span class="dot">${mine} tracked</span>`:''}</div></div>`;
  };
  let html='',last='';
  if(live.length)html+='<div class="day">LIVE NOW</div>'+live.map(card).join('');
  rest.forEach(g=>{
    const ds=new Date(g.date).toDateString();
    if(ds!==last){last=ds;html+=`<div class="day">${ds===today?'TODAY':ds===tom?'TOMORROW':new Date(g.date).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}).toUpperCase()}</div>`}
    html+=card(g);
  });
  if(fin.length)html+='<div class="day">RECENT RESULTS</div>'+fin.map(card).join('');
  html+='<div class="tip">Tap a team in an upcoming game to pick the winner.</div>';
  $('sched').innerHTML=html;
}

/* search */
let sel=0,cur=[];
function suggest(){
  const q=$('inp').value.trim().toLowerCase(),box=$('sug');
  if(q.length<2){box.style.display='none';return}
  cur=players.filter(p=>p.name.toLowerCase().includes(q)&&!watch.some(w=>w.id===p.id)).slice(0,8);sel=0;
  box.innerHTML=cur.map((p,i)=>`<div class="sg${i?'':' on'}" data-i="${i}">
    <img class="face" src="${esc(p.img)}" onerror="${imgErr}">
    <div><b>${esc(p.name)}</b><div class="t">${tImg(teams[p.team])}${esc(teams[p.team]?.name||'')} ${p.pos?'· '+esc(p.pos):''}</div></div></div>`).join('')||'<div class="empty">No players found</div>';
  box.style.display='block';
}
function add(p){
  if(!p)return;
  watch.push({id:p.id,name:p.name,team:p.team});ls.set('nbaWatch2',watch);
  $('inp').value='';$('sug').style.display='none';render();
}
window.rm=id=>{watch=watch.filter(w=>w.id!==id);ls.set('nbaWatch2',watch);render()};
$('inp').addEventListener('input',suggest);
$('inp').addEventListener('keydown',e=>{
  const els=[...document.querySelectorAll('.sg')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(els.length-1,sel+(e.key==='ArrowDown'?1:-1)));els.forEach((x,i)=>x.classList.toggle('on',i===sel))}
  if(e.key==='Enter')add(cur[sel]);
  if(e.key==='Escape')$('sug').style.display='none';
});
$('sug').addEventListener('mousedown',e=>{const s=e.target.closest('.sg');if(s)add(cur[+s.dataset.i])});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sug').style.display=$('psug').style.display=$('tsug').style.display=$('mtsug').style.display='none'});
$('sortBtn').onclick=()=>{sortMode=sortMode==='pts'?'added':'pts';ls.set('nbaSort',sortMode);render()};

/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;ls.set('nbaTheme',t);$('themeBtn').textContent=t==='day'?'☀️ Day':'🌙 Night'}
window.toggleTheme=()=>setTheme(document.documentElement.dataset.theme==='day'?'night':'day');
setTheme(ls.get('nbaTheme','night'));
/* tabs */
const TABS={tracker:'Tracker',players:'Players',teams:'Teams',standings:'Standings',h2h:'Head to Head',injuries:'Injuries'};
$('nav').innerHTML=Object.entries(TABS).map(([k,n])=>`<button data-k="${k}" onclick="tab('${k}')">${n}</button>`).join('');
window.tab=k=>{document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+k));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(k==='standings')loadStand();if(k==='injuries')renderInj()};
document.querySelector('#nav button').classList.add('on');
function fillTeams(){
  const o=Object.values(teams).sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  $('ifil').innerHTML='<option value="">All teams</option>'+o;tgrid();h2hDraw();
}
/* injuries */
let inj=[],injMap={};
const pid=a=>a?.id||players.find(x=>x.name.toLowerCase()===(a?.displayName||'').toLowerCase())?.id;
const av=a=>{const id=pid(a),pl=players.find(x=>x.id===id),src=a?.headshot?.href||pl?.img||(id?face(id):'');
  return `<div class="av">${esc((a?.displayName||'?').split(' ').map(x=>x[0]).slice(0,2).join(''))}${src?`<img src="${esc(src)}" onerror="this.remove()">`:''}</div>`};
const injC=s=>/out/i.test(s)?'o':/day|quest|doubt|prob/i.test(s)?'d':'';
const injB=id=>{const i=injMap[id];if(!i)return'';return `<span class="inj ${injC(i.s)}">${/out/i.test(i.s)?'OUT':/day/i.test(i.s)?'DTD':esc(i.s.slice(0,4).toUpperCase())}</span>`};
async function loadInj(){
  try{const d=await j('injuries');inj=d.injuries||[];injMap={};
    inj.forEach(t=>(t.injuries||[]).forEach(e=>{if(pid(e.athlete))injMap[pid(e.athlete)]={s:e.status||e.type?.description||''}}));}catch(e){}
  render();if($('v-injuries').classList.contains('on'))renderInj();
}
function renderInj(){
  const f=$('ifil').value,q=$('iin').value.toLowerCase();
  const h=inj.filter(t=>!f||t.id===f).map(t=>{
    const es=(t.injuries||[]).filter(e=>!q||(e.athlete?.displayName||'').toLowerCase().includes(q));
    if(!es.length)return'';
    return `<div class="ig"><div class="day tmc">${tImg(teams[t.id])}${esc(t.displayName)} · ${es.length}</div>`+es.map(e=>{
      const s=e.status||e.type?.description||'',d=e.details||{},info=[d.type,d.detail,d.side].filter(Boolean).join(' · ');
      return `<div class="it">${av(e.athlete)}<div style="flex:1;min-width:0"><div class="nm">${esc(e.athlete?.displayName)} <span class="inj ${injC(s)}">${esc(s)}</span></div><div class="gm" style="white-space:normal">${esc(info)}${d.returnDate?' · Return '+esc(d.returnDate):''} ${esc(e.shortComment||'')}</div></div></div>`}).join('')+'</div>';
  }).join('');
  $('inj').innerHTML=h||`<div class="empty">${inj.length?'No matches.':'No injury data available right now.'}</div>`;
}
/* standings */
let stand=0;
async function loadStand(){
  if(stand&&Date.now()-stand<6e4)return;
  $('stand').innerHTML='<div class="panel"><div class="sk"></div></div>';
  let d;try{d=await j('standings',{},'v2');stand=Date.now()}catch(e){$('stand').innerHTML='<div class="panel"><div class="empty">Could not load standings.</div></div>';return}
  const g=(e,n)=>e.stats.find(x=>x.name===n);
  $('stand').innerHTML='<div class="two">'+(d.children||[]).map(c=>{
    const es=[...(c.standings?.entries||[])].sort((a,b)=>(+(g(a,'playoffSeed')?.value||99))-(+(g(b,'playoffSeed')?.value||99))||(+g(b,'winPercent')?.value||0)-(+g(a,'winPercent')?.value||0));
    return `<div class="panel"><div class="ph"><span>${esc(c.name||'').toUpperCase()}</span></div><div class="sc"><table class="tb"><thead><tr><th>#</th><th>TEAM</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>STRK</th></tr></thead><tbody>`+
    es.map((e,i)=>{const t=teams[e.team.id]||{logo:e.team.logos?.[0]?.href,name:e.team.displayName},v=n=>esc(g(e,n)?.displayValue??'–'),pc=(+g(e,'winPercent')?.value||0)*100;
      return `<tr class="cl ${i===6||i===10?'cut':''}" style="--i:${i}" onclick="goTeam('${e.team.id}')"><td>${i+1}</td><td><div class="tmc">${tImg(t)}${esc(t.name||e.team.displayName)}</div><div class="bar"><i style="width:${pc}%"></i></div></td><td>${v('wins')}</td><td>${v('losses')}</td><td>${v('winPercent')}</td><td>${v('gamesBehind')}</td><td>${v('streak')}</td></tr>`}).join('')+'</tbody></table></div></div>';
  }).join('')+'</div><div class="tip">Dashed lines mark the top 6 (direct playoffs) and the play-in spots (7–10).</div>';
}
/* head to head */
let hA=null,hB=null;
function h2hDraw(){
  const slot=(id,l)=>{const t=teams[id];return t?`<div class="slotin"><img src="${esc(t.logo||'')}" onerror="${imgErr}"><b>${esc(t.name)}</b></div>`:l};
  $('sA').className='slot'+(hA?' f':'');$('sB').className='slot'+(hB?' f':'');
  $('sA').innerHTML=slot(hA,'Team 1');$('sB').innerHTML=slot(hB,'Team 2');
  $('hgrid').innerHTML=Object.values(teams).sort((a,b)=>a.name.localeCompare(b.name)).map((t,i)=>`<button class="lg${t.id===hA?' a':t.id===hB?' b':''}" style="--i:${i}" title="${esc(t.name)}" onclick="h2hPick('${t.id}')"><img src="${esc(t.logo||'')}" onerror="${imgErr}"></button>`).join('');
}
window.h2hPick=id=>{
  if(hA===id)hA=null;else if(hB===id)hB=null;else if(!hA)hA=id;else if(!hB)hB=id;else{hA=hB;hB=id}
  h2hDraw();if(hA&&hB)runH2H();else $('hres').innerHTML='';
};
window.h2hSwap=()=>{[hA,hB]=[hB,hA];h2hDraw();if(hA&&hB)runH2H()};
window.goH2H=(a,b)=>{tab('h2h');hA=a;hB=b;h2hDraw();runH2H()};
async function tstat(id){
  const d=await j(`teams/${id}`).catch(()=>null),it=d?.team?.record?.items||[],ov=it.find(i=>i.type==='total')||it[0];
  const n=k=>{const x=ov?.stats?.find(z=>z.name===k);return x&&Number.isFinite(+x.value)?+(+x.value).toFixed(1):null};
  return{ppg:n('avgPointsFor'),opp:n('avgPointsAgainst'),diff:n('differential')};
}
async function runH2H(){
  const a=hA,b=hB,R=$('hres'),A=teams[a],B=teams[b];
  R.innerHTML='<div class="sk"></div>';
  const yr=new Date().getFullYear()+(new Date().getMonth()>=9?1:0);
  const [rs,sa,sb]=await Promise.all([Promise.all([yr,yr-1,yr-2].map(y=>j(`teams/${a}/schedule`,{season:y}).then(d=>d.events||[]).catch(()=>[]))),tstat(a),tstat(b)]);
  if(hA!==a||hB!==b)return;
  const sc=x=>+(typeof x.score==='object'?(x.score.value??x.score.displayValue):x.score)||0,gs=[];
  rs.flat().forEach(e=>{const c=e.competitions?.[0];if(!c?.status?.type?.completed)return;
    const me=c.competitors.find(x=>x.team.id===a),op=c.competitors.find(x=>x.team.id===b);
    if(me&&op)gs.push({d:e.date,me:sc(me),op:sc(op),home:me.homeAway==='home'})});
  gs.sort((x,y)=>new Date(y.d)-new Date(x.d));
  const w=gs.filter(x=>x.me>x.op).length,l=gs.length-w,avg=k=>gs.length?+(gs.reduce((t,x)=>t+x[k],0)/gs.length).toFixed(1):null;
  const pr=(x,y)=>x+y?Math.max(8,Math.min(92,x/(x+y)*100)):50;
  let i=0;
  const row=(lab,va,vb,pa)=>va==null||vb==null?'':`<div class="cmp" style="--i:${i++}"><b>${va}</b><div><div class="gm" style="text-align:center">${lab}</div><div class="cb"><i style="width:${pa}%"></i><i class="r" style="width:${100-pa}%"></i></div></div><b>${vb}</b></div>`;
  const side=(t,n)=>`<div class="tmc">${tImg(t)}<span style="font-size:.85rem">${esc(t.name)}</span>${n==null?'':`<big>${n}</big>`}</div>`;
  R.innerHTML=`<div class="hs">${side(A,gs.length?w:null)}<div class="gm">${gs.length?gs.length+' games · last 3 seasons':'No games in the last 3 seasons'}</div>${side(B,gs.length?l:null)}</div>`+
    row('H2H WINS',w,l,pr(w,l))+row('H2H AVG POINTS',avg('me'),avg('op'),pr(avg('me'),avg('op')))+row('SEASON PPG',sa.ppg,sb.ppg,pr(sa.ppg,sb.ppg))+row('OPP PPG (LOWER IS BETTER)',sa.opp,sb.opp,pr(sb.opp,sa.opp))+row('POINT DIFF',sa.diff,sb.diff,Math.max(10,Math.min(90,50+((sa.diff||0)-(sb.diff||0))*2)))+
    (gs.length?`<div class="day" style="margin-top:12px">GAMES · ${esc(A.abbr)} PERSPECTIVE</div><div class="sc"><table class="tb"><thead><tr><th>DATE</th><th>${esc(A.abbr)}</th><th>SCORE</th><th>RESULT</th></tr></thead><tbody>`+
    gs.map((x,k)=>`<tr style="--i:${Math.min(k,12)}"><td>${new Date(x.d).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})}</td><td>${x.home?'Home':'Away'}</td><td>${x.me} – ${x.op}</td><td><span class="inj ${x.me>x.op?'':'o'}" style="${x.me>x.op?'color:var(--live);border-color:var(--live)':''}">${x.me>x.op?'W':'L'}</span></td></tr>`).join('')+'</tbody></table></div>':'');
}
/* teams */
const tin=$('tin'),tsug=$('tsug');let tc=[];
window.tgrid=()=>{$('tres').innerHTML='<div class="tg">'+Object.values(teams).sort((a,b)=>a.name.localeCompare(b.name)).map((t,i)=>`<button class="tc" style="--i:${i}" onclick="showTeam('${t.id}')">${t.logo?`<img src="${esc(t.logo)}" onerror="${imgErr}">`:''}<span>${esc(t.name)}</span></button>`).join('')+'</div>'};
tin.addEventListener('input',()=>{
  const q=tin.value.trim().toLowerCase();if(!q){tsug.style.display='none';return}
  tc=Object.values(teams).filter(t=>t.name.toLowerCase().includes(q)||t.abbr.toLowerCase()===q).slice(0,8);
  tsug.innerHTML=tc.map((t,i)=>`<div class="sg" data-i="${i}">${t.logo?`<img class="face" style="border-radius:8px;object-fit:contain" src="${esc(t.logo)}" onerror="${imgErr}">`:''}<b>${esc(t.name)}</b></div>`).join('')||'<div class="empty">No teams found</div>';
  tsug.style.display='block';
});
tsug.addEventListener('mousedown',e=>{const x=e.target.closest('.sg');if(x){tsug.style.display='none';tin.value='';showTeam(tc[+x.dataset.i].id)}});
tin.addEventListener('keydown',e=>{if(e.key==='Enter'&&tc[0]){tsug.style.display='none';tin.value='';showTeam(tc[0].id)}});
window.goTeam=id=>{tab('teams');showTeam(id)};
window.goPlayer=id=>{const p=players.find(x=>x.id===id);if(p){tab('players');showPlayer(p)}};
async function showTeam(id){
  const t=teams[id];if(!t)return;
  const head=`<div class="ph0">${t.logo?`<img src="${esc(t.logo)}" style="width:70px;height:70px;object-fit:contain" onerror="${imgErr}">`:''}<div><div class="nm" style="font-size:1.2rem">${esc(t.name)}</div><div class="gm" id="tsum"></div></div><div style="margin-left:auto;display:flex;gap:8px;align-items:center"><button class="add" id="ttrk" onclick="trackT('${id}')">${teamsW.some(w=>w.id===id)?'✓ Tracking':'+ Track team'}</button><button class="h2b" style="font-size:.75rem;padding:6px 14px" onclick="tgrid()">← All teams</button></div></div>`;
  $('tres').innerHTML=head+'<div class="sk"></div>';
  const [a,b]=await Promise.all([j(`teams/${id}`).catch(()=>null),j(`teams/${id}/statistics`).catch(()=>null)]);
  const tm=a?.team||{},items=tm.record?.items||[],ov=items.find(i=>i.type==='total')||items[0];
  const n=k=>{const x=ov?.stats?.find(z=>z.name===k);return x?(typeof x.value==='number'&&!Number.isInteger(x.value)?+x.value.toFixed(1):(x.displayValue??x.value)):null};
  const sm=k=>items.find(i=>i.type===k)?.summary;
  const tl=[['RECORD',ov?.summary],['PPG',n('avgPointsFor')],['OPP PPG',n('avgPointsAgainst')],['DIFF',n('differential')],['HOME',sm('home')],['ROAD',sm('road')],['STREAK',n('streak')]].filter(x=>x[1]!=null&&x[1]!=='');
  const ne=tm.nextEvent?.[0],cats=b?.results?.stats?.categories||b?.stats?.categories||[];
  const tile=(v,l,r,i)=>`<div class="tile" style="--i:${i}"><b>${esc(v)}</b><span>${esc(l)}</span>${r?`<em>#${esc(r)}</em>`:''}</div>`;
  const ros=players.filter(p=>p.team===id);
  $('tres').innerHTML=head+
    (tl.length?`<div class="tiles" style="padding-top:4px">${tl.map((x,i)=>tile(x[1],x[0],'',i)).join('')}</div>`:'')+
    cats.map(c=>`<div class="day">${esc(c.displayName||c.name).toUpperCase()}</div><div class="tiles" style="padding-top:12px">${(c.stats||[]).map((x,i)=>tile(x.displayValue??x.value,x.abbreviation||x.displayName||x.name,x.rank,i)).join('')}</div>`).join('')+
    (cats.length||tl.length?'':'<div class="empty">No team stats available right now.</div>')+
    '<div class="day">PLAYERS · SEASON AVERAGES · MOST POINTS FIRST</div><div id="ros"></div>';
  $('tsum').textContent=[tm.standingSummary,ne?'Next: '+ne.shortName+' · '+new Date(ne.date).toLocaleDateString([],{weekday:'short'})+' '+fmtT(ne.date):''].filter(Boolean).join(' · ');
  loadRoster(id);
}
const pst={};
const f1=v=>v==null||Number.isNaN(v)?'–':v;
function rosHtml(id){
  const ros=players.filter(p=>p.team===id).map(p=>({p,s:pst[p.id]})).sort((x,y)=>(y.s?.PTS||-1)-(x.s?.PTS||-1));
  return '<div class="sc"><table class="tb"><thead><tr><th></th><th>PLAYER</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th></tr></thead><tbody>'+
    ros.map(({p,s},i)=>`<tr class="cl" style="--i:${Math.min(i,14)}" onclick="goPlayer('${p.id}')"><td style="width:50px"><img class="face" src="${esc(p.img)}" onerror="${imgErr}"></td><td><div class="nm">${esc(p.name)} ${injB(p.id)}</div><div class="gm">${esc(p.pos)}</div></td><td>${f1(s?.GP)}</td><td>${f1(s?.MIN)}</td><td style="font-weight:800">${f1(s?.PTS)}</td><td>${f1(s?.REB)}</td><td>${f1(s?.AST)}</td></tr>`).join('')+'</tbody></table></div>';
}
async function loadRoster(id){
  const el=$('ros');if(!el)return;el.innerHTML=rosHtml(id);
  await Promise.all(players.filter(p=>p.team===id&&!pst[p.id]).map(async p=>{
    try{const o=await j(`athletes/${p.id}/overview`,{},'common'),L=o.statistics?.labels||[],sp=o.statistics?.splits?.[0];if(!sp)return;
      const g=k=>sp.stats[L.indexOf(k)];pst[p.id]={GP:g('GP'),MIN:g('MIN'),PTS:parseFloat(g('PTS')),REB:g('REB'),AST:g('AST')}}catch(e){}
  }));
  if($('ros')===el)el.innerHTML=rosHtml(id);
}
/* player stats */
const pin=$('pin'),psug=$('psug');let pc=[];
pin.addEventListener('input',()=>{
  const q=pin.value.trim().toLowerCase();if(q.length<2){psug.style.display='none';return}
  pc=players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,8);
  psug.innerHTML=pc.map((p,i)=>`<div class="sg" data-i="${i}"><img class="face" src="${esc(p.img)}" onerror="${imgErr}"><div><b>${esc(p.name)}</b><div class="t">${tImg(teams[p.team])}${esc(teams[p.team]?.name||'')} ${p.pos?'· '+esc(p.pos):''}</div></div></div>`).join('')||'<div class="empty">No players found</div>';
  psug.style.display='block';
});
psug.addEventListener('mousedown',e=>{const s=e.target.closest('.sg');if(s)pickP(pc[+s.dataset.i])});
pin.addEventListener('keydown',e=>{if(e.key==='Enter'&&pc[0])pickP(pc[0])});
const pickP=p=>{psug.style.display='none';pin.value='';showPlayer(p)};
window.trackP=id=>{
  const p=players.find(x=>x.id===id);if(!p)return;
  const i=watch.findIndex(w=>w.id===id);
  if(i>=0)watch.splice(i,1);else watch.push({id,name:p.name,team:p.team});
  ls.set('nbaWatch2',watch);render();$('trk').textContent=i>=0?'+ Track':'✓ Tracking';
};
let curPid;
function glHtml(g){
  const L=g?.labels||[],ev=g?.events||{};
  const st=(g?.seasonTypes||[]).find(t=>(t.categories||[]).some(c=>c.events?.length));
  if(!st||!L.length)return '<div class="day">GAME LOG</div><div class="empty">No game log available.</div>';
  const rows=(st.categories||[]).flatMap(c=>c.events||[]).map(e=>({s:e.stats||[],i:ev[e.eventId]||{}})).sort((a,b)=>new Date(b.i.gameDate)-new Date(a.i.gameDate));
  const cols=['MIN','PTS','REB','AST','STL','BLK','FG','3PT','FT','TO','PF'].filter(k=>L.includes(k));
  const v=(r,k)=>r.s[L.indexOf(k)];
  const avg=k=>(rows.slice(0,5).reduce((a,r)=>a+(parseFloat(v(r,k))||0),0)/Math.min(5,rows.length)).toFixed(1);
  const tiles=['PTS','REB','AST','MIN'].filter(k=>L.includes(k)).map((k,i)=>`<div class="tile" style="--i:${i}"><b>${avg(k)}</b><span>L5 ${k}</span></div>`).join('');
  return `<div class="day">GAME LOG · ${esc((st.displayName||'').toUpperCase())} · ${rows.length} GAMES</div><div style="height:12px"></div><div class="tiles">${tiles}</div>
  <div class="sc gl" style="max-height:440px;overflow:auto"><table class="tb"><thead><tr><th>DATE</th><th>OPP</th><th>RESULT</th>${cols.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>`+
  rows.map((r,i)=>{const o=r.i.opponent||{},w=r.i.gameResult==='W';
    return `<tr style="--i:${Math.min(i,12)}"><td style="white-space:nowrap">${r.i.gameDate?new Date(r.i.gameDate).toLocaleDateString([],{month:'short',day:'numeric'}):'–'}</td><td><div class="tmc" style="font-weight:600;white-space:nowrap">${esc(r.i.atVs||'')} ${o.logo?`<img class="tl" src="${esc(o.logo)}" onerror="${imgErr}">`:''}${esc(o.abbreviation||'')}</div></td><td style="white-space:nowrap"><span class="inj" style="${w?'color:var(--live);border-color:var(--live)':'color:var(--bad);border-color:var(--bad)'}">${esc(r.i.gameResult||'–')}</span> ${esc(r.i.score||'')}</td>${cols.map(k=>`<td${k==='PTS'?' style="font-weight:800"':''}>${esc(v(r,k)??'–')}</td>`).join('')}</tr>`}).join('')+'</tbody></table></div>';
}
async function showPlayer(p){
  curPid=p.id;const gl=j(`athletes/${p.id}/gamelog`,{},'common').catch(()=>null);
  const head=`<div class="ph0"><img class="face" src="${esc(p.img)}" onerror="${imgErr}"><div><div class="nm">${esc(p.name)} ${injB(p.id)}</div><div class="gm" style="display:flex;align-items:center;gap:5px">${tImg(teams[p.team])}${esc(teams[p.team]?.name||'')} ${p.pos?'· '+esc(p.pos):''}</div></div><button class="add" id="trk" onclick="trackP('${p.id}')">${watch.some(w=>w.id===p.id)?'✓ Tracking':'+ Track'}</button></div>`;
  $('pres').innerHTML=head+'<div class="sk"></div>';
  try{
    const o=await j(`athletes/${p.id}/overview`,{},'common'),st=o.statistics,L=st?.labels||[],sp=st?.splits||[];
    if(!sp.length)throw 0;
    const tiles=['PTS','REB','AST','STL','BLK','FG%','3P%','MIN','GP'].filter(k=>L.includes(k)).map((k,i)=>`<div class="tile" style="--i:${i}"><b>${esc(sp[0].stats[L.indexOf(k)])}</b><span>${k}</span></div>`).join('');
    $('pres').innerHTML=head+`<div class="day">${esc(st.displayName||'SEASON AVERAGES').toUpperCase()}</div><div style="height:12px"></div><div class="tiles">${tiles}</div><div class="sc"><table class="tb pt"><thead><tr><th></th>${L.map(l=>`<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>`+
      sp.map((r,i)=>`<tr style="--i:${i}"><td style="text-align:left;white-space:nowrap">${esc(r.displayName)}</td>${r.stats.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')+'</tbody></table></div>';
  }catch(e){$('pres').innerHTML=head+'<div class="empty">No season stats available for this player.</div>'}
  const g=await gl;if(curPid===p.id)$('pres').insertAdjacentHTML('beforeend',glHtml(g));
}

(async()=>{
  render();
  try{await loadRosters()}catch(e){$('status').textContent='⚠ Could not load players'}
  watch=watch.map(w=>w.team?w:{...w,team:players.find(p=>p.id===w.id)?.team});
  fillTeams();loadInj();setInterval(loadInj,3e5);
  await refresh();
  setInterval(refresh,20000);
